<!doctype html><meta charset="utf-8"><title>CV Studio</title>
<style>
:root{color-scheme:light dark}
body{margin:0;height:100vh;display:grid;place-items:center;background:#131311;color:#eceae2;
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:light){body{background:#f6f6f4;color:#16150f}}
.w{text-align:center}
.s{width:22px;height:22px;margin:0 auto 14px;border:2px solid #3a3a34;border-top-color:#7fd0a6;
 border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.m{opacity:.6;font-size:12px;margin-top:6px}
</style>
<div class="w"><div class="s"></div><div>Starting CV Studio</div>
<div class="m" id="m">preparing the renderer…</div></div>
