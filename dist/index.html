<!doctype html><meta charset="utf-8"><title>CV Studio</title>
<style>
:root{color-scheme:light dark}
body{margin:0;height:100vh;display:grid;place-items:center;background:#131311;color:#eceae2;
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:light){body{background:#f6f6f4;color:#16150f}}
.w{text-align:center;max-width:460px;padding:0 24px}
.s{width:22px;height:22px;margin:0 auto 14px;border:2px solid #3a3a34;border-top-color:#7fd0a6;
 border-radius:50%;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.m{opacity:.6;font-size:12px;margin-top:6px}
.e h1{font-size:16px;margin:0 0 8px}
.e p{margin:0 0 10px}
.e code{font-size:12px;word-break:break-all;opacity:.8}
</style>
<div class="w" id="w"><div class="s"></div><div>Starting CV Studio</div>
<div class="m" id="m">preparing the renderer…</div></div>
<script>
/* The shell reports a renderer that is missing, will not start or does not
   answer by calling this. It used to be defined only in the app's own page,
   which is the page that never arrives when the renderer fails, so the
   spinner simply kept turning. */
(function(){
  var mac=/Mac/.test(navigator.platform), win=/Win/.test(navigator.platform);
  var logs=win?"%LOCALAPPDATA%\\CV Studio\\logs":mac?"~/Library/Application Support/CV Studio/logs"
    :"~/.local/share/cv-studio/logs";
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
  window.studioError=function(msg){
    clearTimeout(late);
    document.getElementById("w").innerHTML='<div class="e"><h1>CV Studio could not start</h1>'+
      '<p>'+esc(msg)+'</p>'+
      '<p>'+(win?'Antivirus software sometimes quarantines the renderer that CV Studio installs. '+
        'If yours reported something, restore it, or reinstall CV Studio. ':'Try reinstalling CV Studio. ')+
      'If it keeps happening, the log helps: <br><code>'+esc(logs)+'</code></p></div>';
  };
  /* A safety net in case the shell's own message never reaches this page. */
  var late=setTimeout(function(){window.studioError("The renderer did not start in time.")},75000);
})();
</script>
