name: Build desktop apps

# Builds Windows and macOS installers. macOS bundles cannot be cross-compiled
# from Windows, because a .app needs a Mach-O binary, so the Mac build runs on
# a macOS runner here rather than on a developer machine.
#
# Releases are signed with the updater key so installed copies will accept them.
# Without the signing secrets the build still succeeds, but the artifacts cannot
# be used as updates.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish, e.g. v0.5.1. Leave empty to build without publishing anything."
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            artifact: windows
          - os: macos-14 # Apple Silicon
            args: "--target aarch64-apple-darwin"
            artifact: macos-arm64
          # macos-13 is retired: that label gets no runner, so the job sat
          # queued for the 24-hour limit and then cancelled the whole run.
          # macos-15-intel is its replacement, and the last Intel image --
          # GitHub drops x86_64 macOS after it retires in autumn 2027.
          - os: macos-15-intel # Intel
            args: "--target x86_64-apple-darwin"
            artifact: macos-x64

    runs-on: ${{ matrix.os }}

    # A tag push releases under that tag. A manual run releases under the tag
    # typed into the input, creating it, which is the way to cut a release
    # without pushing a tag from a machine. Left empty on a manual run this is
    # empty too, and tauri-action then builds without publishing, which is the
    # way to test the pipeline. Never github.ref_name on a manual run: that is
    # the branch, and it would publish a release called "main".
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

    # Creating the release and uploading assets needs write access. Without
    # this the whole matrix builds successfully and then fails at the last
    # step with "Resource not accessible by integration".
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # The tag names the release; tauri.conf.json names the binaries, and the
      # updater compares the latter. Tag v0.8.0 over a tree that still says
      # 0.7.0 and the build succeeds, the release publishes, every asset is
      # called 0.7.0, and latest.json offers 0.7.0 to a machine already
      # running it -- so nothing is ever offered and nothing looks wrong.
      # Fail here instead, before twenty minutes of building three platforms.
      - name: The tag and the app version must agree
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          want="${RELEASE_TAG#v}"
          # No python here on purpose: this step runs before setup-python, and
          # it is the one step that must not fail for a reason of its own.
          have=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                 src-tauri/tauri.conf.json | head -1)
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $RELEASE_TAG wants version $want, but"\
                 "src-tauri/tauri.conf.json says $have. Bump the version in"\
                 "tauri.conf.json, Cargo.toml, the cv-studio entry in"\
                 "Cargo.lock and VERSION in server/studio.py, then tag again."
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches app version $have."

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build the Python server (PyInstaller)
        shell: bash
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          # cryptography, which mcp pulls in, has to come from a wheel. Built
          # from source on the Intel runner it links against Homebrew's OpenSSL,
          # while PyInstaller bundles the older libssl.3.dylib the runner's
          # Python uses. The two collide on filename, the frozen _rust.abi3.so
          # binds to the older one, and importing mcp dies with
          # "Symbol not found: _SSL_get0_group_name". That is what kept v0.5.0
          # from shipping an Intel build at all. The published wheels link
          # OpenSSL statically, so there is no libssl left to collide.
          pip install --only-binary=:all: cryptography
          # Pinned, and the pin is the point. RenderCV changes its design schema
          # inside a major version: the starter CV that renders under 2.8 is
          # rejected outright by 2.3, because the models use extra="forbid" and
          # keys have been renamed and moved between them. An unpinned install
          # means the day upstream renames another one, a tagged release fails
          # at the smoke test rather than at a moment you chose.
          #
          # mcp is pinned for the same reason one level down: mcp_server.py
          # imports MCPServer from mcp.server.mcpserver, which is a 2.x path.
          #
          # These are the newest versions of each as of this pin. Raising them
          # is a deliberate edit, which is the difference worth having.
          pip install "rendercv[full]==2.8" "ruamel.yaml==0.19.1" "mcp==2.2.0" \
            "pyinstaller==6.22.3"
          # rendercv_fonts, typst and mcp ship binaries and package data that
          # PyInstaller does not discover on its own.
          #
          # server/static holds the vendored d3 modules and the interface fonts,
          # which the server reads from _MEIPASS at runtime. Without --add-data
          # they are simply absent from the bundle: the funnel chart fails to
          # load its scripts and the interface falls back to a system face.
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          PYTHONIOENCODING=utf-8 pyinstaller --onedir --noconfirm --clean \
            --name cv-studio-server \
            --add-data "static${SEP}static" \
            --collect-all rendercv \
            --collect-all rendercv_fonts \
            --collect-all typst \
            --collect-all ruamel.yaml \
            --collect-all mcp \
            --collect-all pydantic \
            --hidden-import cv_render \
            --hidden-import cv_map \
            --hidden-import studio \
            --hidden-import mcp_server \
            --paths . \
            server_main.py

      - name: Stage the server as a Tauri resource
        shell: bash
        run: |
          rm -rf src-tauri/server-dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            # ditto rather than cp: it is the only copy on macOS that preserves
            # extended attributes and symlinks exactly, and a code signature
            # that survives the copy is the whole point of the next step.
            ditto server/dist/cv-studio-server src-tauri/server-dist
          else
            cp -r server/dist/cv-studio-server src-tauri/server-dist
          fi

      # Runs before the smoke test on purpose. Signing turns on the hardened
      # runtime, which is exactly the kind of change that can leave a binary
      # that builds and refuses to start, so the smoke test below is what
      # proves the signed server still renders and still speaks MCP.
      - name: Sign the frozen server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CERT_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Read under other names so they are never defined for the bundler
          # unless the block below deliberately exports them. See the comment
          # there for why an empty one is worse than a missing one.
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # Ad-hoc unless a Developer ID is in the secrets. An ad-hoc signature
          # is not a Developer ID and will not get a downloaded copy past
          # Gatekeeper on its own, but it does give every Mach-O in the bundle a
          # valid seal. That is what lets the app run once the quarantine flag
          # is cleared, and it is the shape notarization needs if a certificate
          # is ever added.
          IDENTITY="-"
          TIMESTAMP=""
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p "" "$KEYCHAIN"
            security set-keychain-settings "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
              -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" \
              $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/cert.p12"
            IDENTITY="$CERT_IDENTITY"
            # A trusted timestamp is required for notarization and refused for
            # an ad-hoc signature, so it only goes on the real-identity path.
            # Left unquoted below so that empty expands to no argument at all,
            # which an array would not do safely under the bash 3.2 that ships
            # with macOS.
            TIMESTAMP="--timestamp"

            # Notarization is Tauri's next step after signing, and it decides
            # to attempt it on the mere presence of these variables rather than
            # on whether they contain anything. An unset repository secret
            # reaches a workflow as the empty string, not as undefined, so
            # listing them in the bundler's env block made every build try to
            # notarize with blank credentials and die on "Team ID must be at
            # least 3 characters". Exporting them here means they exist only
            # when all three are real, and only alongside a Developer ID, which
            # is the only thing notarization can act on anyway.
            if [ -n "${NOTARY_APPLE_ID:-}" ] &&
               [ -n "${NOTARY_PASSWORD:-}" ] &&
               [ -n "${NOTARY_TEAM_ID:-}" ]; then
              {
                echo "APPLE_ID=$NOTARY_APPLE_ID"
                echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
                echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "notarization credentials complete, the bundle will be notarized"
            else
              echo "notarization credentials absent or partial, signing only"
            fi
          fi

          # Hand the identity to the Tauri bundler in the next step so the .app
          # is sealed by the same one.
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Inside out: nested code first, containers last, because signing
          # something underneath an existing seal invalidates it. Tauri signs
          # the .app in the next step; this covers the frozen Python, which it
          # copies in as an opaque resource tree and never walks.
          #
          # Match on the exec bit and on extension: wheels are not consistent
          # about marking .so files executable, and an unsigned extension
          # module is enough to fail the whole bundle.
          find src-tauri/server-dist -type f \
            \( -perm -u+x -o -name '*.so' -o -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' f; do
              file -b "$f" | grep -q 'Mach-O' || continue
              codesign --force --options runtime $TIMESTAMP \
                --sign "$IDENTITY" "$f"
            done

          # The entry point last, and the only one that carries entitlements:
          # they apply to the process, and codesign ignores them on a library.
          codesign --force --options runtime $TIMESTAMP \
            --entitlements src-tauri/entitlements.plist \
            --sign "$IDENTITY" src-tauri/server-dist/cv-studio-server

          codesign --verify --strict src-tauri/server-dist/cv-studio-server
          echo "frozen server signed with identity: $IDENTITY"

      - name: Smoke-test the packaged server
        shell: bash
        run: |
          BIN=src-tauri/server-dist/cv-studio-server
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --port 8899 --workspace "$RUNNER_TEMP/ws" &
          sleep 15
          # A build that ships but cannot render is worse than a failed build.
          # Fail here instead of finding out after release.
          curl -sf -m 120 -X POST http://127.0.0.1:8899/api/render \
            -H "Content-Type: application/json" \
            -d '{"path":"profile/my-cv.yaml"}' -o result.json
          grep -q '"ok": true' result.json || { echo "packaged renderer failed"; cat result.json; exit 1; }
          # cv_map degrades silently by design, so a render succeeding proves
          # nothing about it. Assert the block map is really in the response, or
          # a bundle that lost the module ships with a page you cannot click.
          grep -q '"map"' result.json || {
            echo "packaged build renders but produces no block map (cv_map missing?)"
            cat result.json; exit 1; }
          echo "packaged renderer and block map OK"

          # And the other half of the binary: the MCP surface Claude Desktop uses.
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' | "$BIN" --mcp --workspace "$RUNNER_TEMP/ws" > mcp.json || true
          grep -q '"serverInfo"' mcp.json || {
            echo "packaged MCP server did not complete a handshake"; cat mcp.json; exit 1; }
          echo "packaged MCP server OK"

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key was generated without a password, and GitHub will not accept
          # an empty secret value. Setting it here keeps the signer from
          # prompting in CI, and an empty password is not a secret anyway.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # APPLE_SIGNING_IDENTITY, and the notarization credentials when there
          # are any, both come from the signing step above via GITHUB_ENV. The
          # identity is "-" normally and the Developer ID when one is
          # configured. Nothing Apple-related is listed here on purpose: an
          # absent secret would arrive as an empty string and Tauri reads these
          # by presence, so a name written here is a name Tauri acts on.
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "CV Studio ${{ env.RELEASE_TAG }}"
          releaseBody: |
            Not notarized by Apple or signed by Microsoft, so first launch needs
            one extra step.

            **macOS**: open the disk image, drag CV Studio to Applications, then
            run this once:

            ```
            xattr -dr com.apple.quarantine "/Applications/CV Studio.app"
            ```

            After that it opens by double-click like anything else. Without it
            macOS reports the app as *damaged and can't be opened*, which is
            what it says about any app that was downloaded and is not notarized.
            The app is not damaged, and the command does not disable anything
            system-wide: it clears the flag macOS attached to this one download.

            Right-click then Open used to work instead and no longer does.
            macOS 15 removed it, so on Sequoia and later the command above is
            the way in.

            **Windows**: SmartScreen may warn on first run. Choose
            More info, then Run anyway. Installs per-user, no admin needed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # "Damaged and can't be opened" is also what macOS says about a bundle
      # whose seal does not match its contents, which is a real thing to ship by
      # accident and indistinguishable, from the dialog, from merely not being
      # notarized. Checking here means only one of those two can ever reach a
      # user, and the release notes already cover that one.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # -print -quit rather than piping to head: under pipefail, head
          # closing the pipe early kills find with SIGPIPE and fails the step.
          APP=$(find src-tauri/target -type d -name "CV Studio.app" \
            -path "*/bundle/macos/*" -print -quit)
          [ -n "$APP" ] || { echo "no .app was produced"; exit 1; }

          # --deep walks the frozen Python as well, so a resource that was
          # modified after signing fails here rather than on a user's machine.
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 |
            grep -E 'Identifier|Authority|TeamIdentifier|Runtime' || true

          # Informational only. Without notarization this rejects, and that
          # rejection is precisely what the release notes tell people to expect,
          # so it must not fail the build.
          spctl --assess --type execute --verbose=4 "$APP" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cv-studio-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn
