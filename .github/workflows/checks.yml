name: Checks

# Every push to main and every pull request, before anything is tagged: the
# static audit, the scripts parsing, the Python checks, the MCP server spoken
# to over stdio, and the browser flows against a running app. The release
# workflow builds; this one says whether what it would build works.
#
# Pushes to other branches are left to their pull request: a commit pushed to
# a working branch and to main at once ran twice, and a failure said so twice.

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      # The app's data folder (fonts, preferences, sample data) inside the
      # runner's scratch space. The runner context is not available to a
      # job-level env, hence a step.
      - name: Scratch data folder
        run: echo "XDG_DATA_HOME=$RUNNER_TEMP/data" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install the server's dependencies (the release's pins)
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: cryptography
          pip install "rendercv[full]==2.8" "ruamel.yaml==0.19.1" "mcp==2.2.0" \
            "pypdf==6.19.0" "tzdata==2026.4"
          # For the checks only: phototest makes its test JPEGs with it, and
          # themetest reads PDFs by position the way some ATS do. The app
          # itself is built without either.
          pip install pillow "pdfminer.six==20260107"

      - name: Scripts parse
        run: python checks/jscheck.py

      - name: Static audit of the interface
        run: python checks/audit.py

      - name: Preferences
        run: python checks/prefstest.py

      - name: Languages
        run: python checks/langtest.py

      - name: Cover letters
        run: python checks/lettertest.py

      - name: Importing a CV
        run: python checks/importtest.py

      - name: Photo
        run: python checks/phototest.py

      - name: The page map
        run: python checks/maptest.py

      - name: Sample data
        run: python checks/sampletest.py

      - name: Trash and rename
        run: python checks/trashtest.py

      - name: Backups
        run: python checks/backuptest.py

      - name: Search
        run: python checks/searchtest.py

      - name: Application pack
        run: python checks/packtest.py

      - name: People
        run: python checks/peopletest.py

      - name: Interview rounds
        run: python checks/roundstest.py

      - name: Interview prep
        run: python checks/preptest.py

      - name: Posting from a link
        run: python checks/postingtest.py

      - name: CV Studio's themes
        run: python checks/themetest.py

      - name: Save to CV Studio
        run: python checks/cliptest.py

      - name: Other websites cannot reach the app
        run: python checks/originsafety.py

      - name: Translations built and complete
        run: |
          python i18n/build.py
          git diff --exit-code -- static/i18n.js || { echo "static/i18n.js is stale: run python i18n/build.py"; exit 1; }
          python checks/i18nserver.py

      - name: MCP over stdio
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-ws"
          python checks/mcpclient.py python server_main.py --mcp --workspace "$RUNNER_TEMP/mcp-ws"

      - name: Browser flows
        run: |
          mkdir -p "$RUNNER_TEMP/flow-ws"
          python studio.py --port 8750 --token t --workspace "$RUNNER_TEMP/flow-ws" \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          google-chrome --headless=new --disable-gpu --no-sandbox --hide-scrollbars \
            --window-size=1440,960 --remote-debugging-port=9333 \
            --user-data-dir="$RUNNER_TEMP/chrome" about:blank > /dev/null 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "http://127.0.0.1:8750/api/state" -H "X-API-Key: t" > /dev/null \
              && curl -sf http://127.0.0.1:9333/json/version > /dev/null && break
            sleep 1
          done
          node checks/flow.js "http://127.0.0.1:8750/?token=t&lang=en"

      - name: Every screen translated
        run: node checks/i18nscan.js "http://127.0.0.1:8750/?token=t&lang=en"

      - name: Accessibility (contrast, keyboard, names)
        run: node checks/a11yscan.js "http://127.0.0.1:8750/?token=t"

      - name: Quick with 500 applications
        run: node checks/scaletest.js "http://127.0.0.1:8750/?token=t"

      - name: Server log, when something failed
        if: failure()
        run: cat "$RUNNER_TEMP/server.log" || true
