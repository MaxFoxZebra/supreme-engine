[package]
name = "cv-studio"
version = "0.1.0"
description = "CV Studio, a local RenderCV editor"
authors = ["CV Studio contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# The whole point of this stack is a small binary: strip symbols, optimise for
# size, and drop the unwinding machinery we never use.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
