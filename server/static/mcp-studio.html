<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Studio</title>
<!--
  CV Studio itself, beside the chat (MCP Apps view, ui://cv-studio/studio.html).

  The whole app, not a view made for the chat: the connector serves CV
  Studio's own page from this computer, on a port and with a key of its own
  (open_studio), and this frames it. What is done in it is the user's, saved
  to the same files the tools read, so Claude sees it at the next call.

  It asks to sit beside the chat (MCP Apps' "pip"), else full screen, and
  says what to do when the client will not frame it: open it in the browser.
-->
<style>
  :root{
    color-scheme:light dark;
    --bg:var(--color-background-primary,light-dark(#fff,#262624));
    --bg2:var(--color-background-secondary,light-dark(#f5f4ef,#30302e));
    --tx:var(--color-text-primary,light-dark(#1f1e1d,#faf9f5));
    --tx2:var(--color-text-secondary,light-dark(#5e5d59,#c2c0b6));
    --rule:var(--color-border-secondary,light-dark(#e2e0d9,#3a3936));
    --acc:var(--color-ring-primary,light-dark(#c96442,#d97757));
    --font:var(--font-sans,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif);
    --fs:var(--font-text-md-size,14px);
    --fs-sm:var(--font-text-sm-size,13px);
  }
  :root[data-theme=light]{color-scheme:light}
  :root[data-theme=dark]{color-scheme:dark}
  html,body{margin:0;height:100%;background:transparent;color:var(--tx);font:var(--fs)/1.5 var(--font)}
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #app{display:flex;flex-direction:column;height:100%}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 4px 8px;flex:none}
  .bar b{font-weight:600;white-space:nowrap}
  .bar .what{flex:1;min-width:0;color:var(--tx2);font-size:var(--fs-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .btn{font:inherit;font-size:var(--fs-sm);padding:4px 10px;border-radius:8px;border:1px solid var(--rule);
    background:var(--bg);color:var(--tx);cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--bg2)}
  .frame{flex:1;min-height:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--bg)}
  :root[data-mode=inline] .frame{flex:none;height:760px}
  iframe{display:block;width:100%;height:100%;border:0}
  .state{color:var(--tx2);padding:24px 8px;text-align:center}
  .state b{display:block;color:var(--tx);margin-bottom:4px}
  .state .btn{margin-top:10px}
</style>
</head>

/* The views in the language of the chat they are shown in.

   The client says its locale in the view's host context ("fr-FR"); this
   translates the view's own words into French, Spanish or Brazilian
   Portuguese the way the app does: by the English text exactly as shown,
   then by patterns for the ones with a number or a name in them, as text
   lands in the page. CV text, postings, names and notes are never touched:
   anything under [data-noi18n] is skipped.

   The catalogue (window.CVS_I18N, CVS_I18N_RX) is written by i18n/build.py
   from i18n/views.py; the server puts both scripts into each view. */
window.cvsI18n = (function () {
  const LANGS = {fr: 1, es: 1, pt: 1};
  let lang = "en", locale = undefined, D = null, P = [], watching = false;
  const SKIP = "[data-noi18n],textarea,input,script,style,code,pre";
  const ATTRS = ["placeholder", "title", "aria-label"];

  /* "envoyée(s)" settled by the count in front of it; French counts 0 and 1
     as singular. */
  const plur = r => {
    if (r.indexOf("(s)") < 0) return r;
    let n = null;
    return r.replace(/(\d+)|\(s\)/g, (m, d) => d != null ? (n = +d, m) : n == null ? m : (lang === "fr" ? n < 2 : n === 1) ? "" : "s");
  };
  function tr(str) {
    if (!D) return null;
    const key = str.replace(/\s+/g, " ").trim();
    if (!key || key.length > 600) return null;
    let out = D[key];
    if (out == null) for (const [re, rep] of P) if (re.test(key)) { out = key.replace(re, rep); break; }
    if (out == null || out === key) return null;
    out = plur(out);
    if (out === key) return null;
    return str.match(/^\s*/)[0] + out + str.match(/\s*$/)[0];
  }
  function attrs(el) {
    for (const a of ATTRS) { const v = el.getAttribute(a); if (v) { const r = tr(v); if (r != null) el.setAttribute(a, r); } }
  }
  function node(n) {
    if (!D) return;
    if (n.nodeType === 3) {
      const p = n.parentElement; if (!p || p.closest(SKIP)) return;
      const r = tr(n.nodeValue); if (r != null) n.nodeValue = r;
      return;
    }
    if (n.nodeType !== 1 || n.closest(SKIP)) return;
    attrs(n);
    const w = document.createTreeWalker(n, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, {acceptNode: x =>
      (x.nodeType === 1 ? x : x.parentElement).closest(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    let x;
    while ((x = w.nextNode())) {
      if (x.nodeType === 3) { const r = tr(x.nodeValue); if (r != null) x.nodeValue = r; }

    }

      if (m.type === "childList") m.addedNodes.forEach(node);
      else node(m.target);
    } }).observe(document.body, {childList: true, subtree: true, characterData: true,
      attributes: true, attributeFilter: ATTRS});
  }
  return {
    /* From the host context: a BCP 47 tag, or nothing. */
    set(tag) {
      const t = String(tag || navigator.language || "en");
      locale = t;
      const l = t.slice(0, 2).toLowerCase();
      lang = LANGS[l] ? l : "en";
      D = lang === "en" ? null : (window.CVS_I18N || {})[lang] || null;
      P = lang === "en" ? [] : (window.CVS_I18N_RX || {})[lang] || [];

    locale: () => locale,

    const sc = r.structuredContent || r.structured_content;
    if (r.isError || !sc || !sc.url) {
      const text = (r.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
      $app.innerHTML = '<div class="state"><b>CV Studio did not open.</b>' + esc(text) + "</div>";
      return;
    }
    data = sc; ready = false;
    paint(true);
    autoMode();
    /* A client that will not frame it shows nothing, and says nothing. */
    setTimeout(() => { if (!ready) paint(); }, 15000);
  }
  /* Beside the chat, as asked; full screen where that is not offered. Once,
     and only when the client has said what it offers. */
  function autoMode() {
    if (asked || !data || !host.inited) return;
    asked = true;
    const want = modes().includes("pip") ? "pip" : modes().includes("fullscreen") ? "fullscreen" : null;
    if (want && mode() !== want) setMode(want);
  }
  async function setMode(m) {
    try {
      const r = await request("ui/request-display-mode", {mode: m});
      applyContext({displayMode: (r && r.mode) || host.ctx.displayMode});
    } catch (e) { /* the client said no */ }
  }
  function paint(fresh) {
    if (!data) return;
    const btns = [];
    if (modes().includes("pip") && mode() !== "pip") btns.push(["pip", "Beside the chat"]);
    if (modes().includes("fullscreen") && mode() !== "fullscreen") btns.push(["fullscreen", "Full screen"]);
    if (mode() !== "inline") btns.push(["inline", "In the chat"]);
    const bar = '<div class="bar"><b>CV Studio</b><span class="what">' + (data.label ? U(data.label) : "") + "</span>" +
      btns.map(([m, l]) => '<button class="btn" data-mode="' + m + '">' + esc(l) + "</button>").join("") +
      (host.caps.openLinks ? '<button class="btn" id="out">Open in your browser</button>' : "") + "</div>";
    const stuck = !ready && !fresh && !document.getElementById("studio-note");
    if (fresh || !document.getElementById("studio")) {
      $app.innerHTML = bar + '<div class="frame"><iframe id="studio" title="CV Studio" src="' + esc(src()) + '"></iframe></div>';
    } else {
      $app.querySelector(".bar").outerHTML = bar;
    }
    if (stuck) {
      $app.querySelector(".frame").insertAdjacentHTML("beforebegin", '<div class="state" id="studio-note"><b>CV Studio did not load here.</b>' +
        "<span>This client may not show another page inside the chat.</span>" +
        (host.caps.openLinks ? "" : " <span>Open the CV Studio app instead.</span>") + "</div>");
    }
    $app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));
    const out = document.getElementById("out");
    if (out) out.onclick = () => request("ui/open-link", {url: src()}).catch(() => {});
    size();
  }
  function size() {
    const h = mode() === "inline" ? Math.ceil(document.documentElement.scrollHeight) : 0;
    if (h && h !== lastH) { lastH = h; notify("ui/notifications/size-changed", {width: Math.ceil(window.innerWidth), height: h}); }
  }

  request("ui/initialize", {
    appInfo: {name: "CV Studio", version: "1"},
    appCapabilities: {availableDisplayModes: ["inline", "fullscreen", "pip"]},
    protocolVersion: PROTOCOL,
  }).then(r => {
    host.caps = (r && r.hostCapabilities) || {};
    host.inited = true;
    applyContext((r && r.hostContext) || {});
    if (data) { paint(); autoMode(); }
    notify("ui/notifications/initialized", {});
  }).catch(() => { host.inited = true; notify("ui/notifications/initialized", {}); });
})();
</script>
</body>
</html>
