<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV page</title>
<!--
  The page view an AI client shows with render_cv (MCP Apps). It runs in the
  client's sandboxed frame with no network, so everything is in this file.
  The pages come by id in the tool result, and it fetches each as an image
  through the server (page_view_data): the one it opens on first, then the
  others. A client drops a structured result over its size cap whole, and
  one dense page is enough to go over. It speaks to the client over postMessage
  (JSON-RPC 2.0): ui/initialize, then it is handed the tool's input and
  result.

  A CV rendered again leaves its earlier views in the conversation; each
  asks the server whether it is still the latest, and folds to one line if
  not. The latest one can hand over the PDF (ui/download-file).

  What it is for: seeing the page, pointing at a part of it, and seeing what
  a change changed. A click on a block selects it and opens a box beside it;
  what is typed there goes to the chat as the user's message (ui/message),
  while the file, the place in the YAML and "render it again" go to the model
  out of sight (ui/update-model-context). A render that follows a change marks
  the blocks it changed and keeps the page before it, to compare.

  CV text (labels) reaches the model only as one short plain line: a CV can
  carry text from an imported PDF or a posting.

  Preview it without Claude: node checks/viewdev.js
-->
<style>
  /* Claude's own colours, type and sizes when it sends them; these
     fallbacks follow light and dark by themselves (color-scheme + light-dark),
     so the view reads as part of the conversation either way. It paints no
     background of its own: the chat shows through. */
  :root{
    color-scheme:light dark;
    --bg:var(--color-background-primary,light-dark(#fff,#262624));
    --bg2:var(--color-background-secondary,light-dark(#f5f4ef,#30302e));
    --bg3:var(--color-background-tertiary,light-dark(#eeece5,#1f1e1d));
    --tx:var(--color-text-primary,light-dark(#1f1e1d,#faf9f5));
    --tx2:var(--color-text-secondary,light-dark(#5e5d59,#c2c0b6));
    --tx3:var(--color-text-tertiary,light-dark(#87867f,#9a9890));
    --rule:var(--color-border-secondary,light-dark(#e2e0d9,#3a3936));
    --rule2:var(--color-border-primary,light-dark(#c9c7bf,#4a4945));
    --acc:var(--color-ring-primary,light-dark(#c96442,#d97757));
    --new:var(--color-text-success,light-dark(#2f8f5b,#5cc58a));
    --warn:var(--color-text-warning,light-dark(#9a5b13,#e6b26a));
    --warnbg:var(--color-background-warning,light-dark(#fbf1e2,#3a2f20));
    --ok:var(--color-text-success,light-dark(#2f6b3b,#8cc79a));
    --font:var(--font-sans,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif);
    --mono:var(--font-mono,ui-monospace,"SFMono-Regular",Menlo,monospace);
    --fs:var(--font-text-md-size,14px);
    --fs-sm:var(--font-text-sm-size,13px);
    --fs-xs:var(--font-text-xs-size,12px);
    --r:var(--border-radius-md,8px);
    --sheet:560px;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  :root[data-theme=light]{color-scheme:light}
  :root[data-theme=dark]{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--tx);font:var(--fs)/1.5 var(--font);
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}

  /* ---- the bar: whose CV, how it lays out, what changed ---- */
  .bar{display:flex;align-items:center;gap:12px;margin:0 auto 12px;
    max-width:calc(var(--sheet) + 104px);min-height:40px}
  .avatar{width:40px;height:40px;border-radius:11px;flex:none;display:grid;place-items:center;overflow:hidden;
    font-size:14px;font-weight:600;color:var(--tx2);background:color-mix(in srgb,var(--tx) 7%,transparent);
    box-shadow:0 0 0 1px var(--rule)}
  .avatar img{width:100%;height:100%;object-fit:contain;background:#fff}
  .who{min-width:0;flex:1}
  :root:not([data-mode=fullscreen]) .who b{font-size:18px;letter-spacing:-.015em;line-height:1.25}
  .who em{font-style:normal;color:var(--tx2)}
  .who b{display:block;font-weight:600;font-size:var(--fs);letter-spacing:-.005em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who span{display:block;color:var(--tx3);font-size:var(--fs-xs);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
  .who span code{font:11.5px var(--mono)}
  .facts{display:flex;align-items:center;gap:6px;flex:none}
  .fact{font-size:var(--fs-xs);color:var(--tx3);white-space:nowrap}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--tx3);opacity:.6}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;
    border-radius:99px;padding:3px 10px;white-space:nowrap;border:0}
  .badge.ok{color:var(--ok);background:none;padding:0 0 0 4px}
  .badge.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .badge.warn{color:var(--warn);background:var(--warnbg)}
  .badge.warn button{border:0;background:none;padding:0;margin-left:2px;font-weight:600;
    color:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
  .icon{width:30px;height:30px;display:grid;place-items:center;border:0;
    background:none;border-radius:var(--r);cursor:pointer;color:var(--tx3);flex:none;
    transition:background .15s,color .15s}
  .icon:hover{background:var(--bg2);color:var(--tx)}
  .icon svg{width:15px;height:15px}

  /* The verdict and the numbers, under the name. */
  .summary{margin:0 auto 14px;max-width:calc(var(--sheet) + 104px)}
  .verdict{display:flex;align-items:center;gap:14px;position:relative;padding:1px 0 1px 15px;margin-bottom:12px}
  .verdict::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--acc)}
  .verdict p{margin:0;flex:1;font-size:15.5px;line-height:1.45;font-weight:500;letter-spacing:-.008em;text-wrap:pretty}
  .verdict .btn.go{flex:none;background:var(--acc);color:#fff;padding:6px 13px}
  .pstats{display:flex;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .pstats>div{flex:1;padding:9px 12px 8px;min-width:0}
  .pstats>div+div{box-shadow:inset 1px 0 0 var(--rule)}
  .pstats b{display:block;font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.2;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pstats span{display:block;font-size:var(--fs-xs);color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pstats .for b{font-size:15px;line-height:1.6}
  .meter{display:block;height:4px;border-radius:2px;background:color-mix(in srgb,var(--tx) 9%,transparent);margin-top:6px;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:2px;background:var(--acc)}
  @media (max-width:520px){.pstats .for{display:none}}

  /* Arriving: once, when a new render comes in. */
  @keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .anim .bar,.anim .summary{animation:arrive .45s var(--ease) both}
  .anim .summary{animation-delay:.05s}
  .anim .delta{animation-delay:.1s}
  .anim .sheet{animation:arrive .55s var(--ease) .12s both}
  .anim .rail .thumb{animation:arrive .4s var(--ease) both;animation-delay:.25s}
  .anim .meter i{transform-origin:left;animation:growx .7s var(--ease) .3s both}

  /* What a change changed: a strip under the bar, and the before/after switch. */
  .delta{display:flex;align-items:center;gap:10px;margin:-4px auto 12px;
    max-width:calc(var(--sheet) + 104px);padding:0 0 10px;font-size:var(--fs-sm);
    border-bottom:1px solid var(--rule);animation:in .3s var(--ease) both}
  .delta .mark{width:7px;height:7px;border-radius:50%;background:var(--new);flex:none}
  .delta{flex-wrap:wrap;row-gap:8px}
  .delta span{flex:1 1 auto;min-width:0;color:var(--tx2);white-space:nowrap}
  .delta .seg+.acts,.delta .seg{margin-left:auto}
  .delta span b{color:var(--tx);font-weight:600}
  .seg{display:inline-flex;background:color-mix(in srgb,var(--tx) 6%,transparent);border-radius:7px;padding:2px;flex:none}
  .seg button{border:0;background:none;padding:3px 10px;border-radius:5px;font-size:12px;
    color:var(--tx2);cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--bg);color:var(--tx);font-weight:500;
    box-shadow:0 1px 2px rgba(0,0,0,.12)}

  /* ---- the page, and the others beside it ---- */
  .body{display:flex;gap:14px;justify-content:center;align-items:flex-start}
  .stage{position:relative;flex:0 1 var(--sheet);min-width:0}
  .sheet{position:relative;background:#fff;border-radius:4px;overflow:hidden;
    box-shadow:0 0 0 1px color-mix(in srgb,var(--tx) 10%,transparent),0 1px 3px rgba(0,0,0,.05)}
  .sheet img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;
    animation:fade .22s ease-out}
  @keyframes fade{from{opacity:.25}to{opacity:1}}
  @keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .ribbon{position:absolute;top:10px;right:10px;z-index:3;font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;color:#fff;background:rgba(31,30,29,.78);
    padding:3px 9px;border-radius:99px}
  .rail{display:flex;flex-direction:column;gap:12px;flex:none;width:84px}
  .thumb{border:0;padding:0;background:none;cursor:pointer;text-align:center;color:var(--tx3);
    font-size:11px;font-variant-numeric:tabular-nums}
  .thumb img{display:block;width:100%;border-radius:2px;background:#fff;margin-bottom:4px;
    box-shadow:0 0 0 1px var(--rule);transition:box-shadow .15s,transform .15s var(--ease)}
  .thumb:hover img{transform:translateY(-1px);box-shadow:0 0 0 1px var(--rule2),0 3px 10px rgba(0,0,0,.08)}
  .thumb[aria-current=page] img{box-shadow:0 0 0 2px var(--acc)}
  .thumb[aria-current=page]{color:var(--tx);font-weight:500}

  /* ---- blocks: quiet until pointed at; a mark in the margin, not a box on the text ---- */
  .hit{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;outline:none;
    border-radius:3px;transition:background .15s}
  .hit::before{content:"";position:absolute;left:-9px;top:3px;bottom:3px;width:3px;border-radius:2px;
    background:var(--acc);opacity:0;transform:scaleY(.6);transition:opacity .15s,transform .2s var(--ease)}
  .hit:hover,.hit:focus-visible{background:color-mix(in srgb,var(--acc) 5%,transparent)}
  .hit:hover::before,.hit:focus-visible::before{opacity:.55;transform:none}
  .hit.sel{background:color-mix(in srgb,var(--acc) 7%,transparent)}
  .hit.sel::before{opacity:1;transform:none}
  .hit.new::after{content:"";position:absolute;left:-9px;top:3px;bottom:3px;width:3px;border-radius:2px;
    background:var(--new);animation:glow 1.6s ease-out 1}
  .hit.new.sel::after,.hit.new:hover::after{opacity:0}
  @keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--new) 60%,transparent)}
    100%{box-shadow:0 0 0 8px transparent}}
  .hit.sent{background:repeating-linear-gradient(135deg,transparent 0 6px,
      color-mix(in srgb,var(--acc) 9%,transparent) 6px 7px)}
  .hit.sent::before{opacity:1;transform:none}
  .tag{position:absolute;z-index:3;pointer-events:none;font-size:11.5px;font-weight:500;
    color:var(--tx);background:var(--bg);border:1px solid var(--rule);padding:1px 8px;
    border-radius:6px;white-space:nowrap;transform:translateY(calc(-100% - 4px));display:none;
    max-width:80%;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .tag i{font-style:normal;color:var(--new);font-weight:600;margin-left:6px}

  .coach{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;
    background:rgba(31,30,29,.9);color:#fff;font-size:12.5px;padding:7px 13px;border-radius:99px;
    white-space:nowrap;pointer-events:none;animation:rise .4s var(--ease) both .5s;
    box-shadow:0 4px 14px rgba(0,0,0,.2)}
  @keyframes rise{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ---- the box beside a block ---- */
  .pop{position:absolute;z-index:4;width:min(400px,calc(100% - 16px));background:var(--bg);
    color:var(--tx);border:1px solid var(--rule);border-radius:12px;padding:10px;
    box-shadow:0 12px 32px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06);
    animation:pop .16s var(--ease)}
  :root[data-theme=dark] .pop{box-shadow:0 14px 36px rgba(0,0,0,.5)}
  @keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
  .pop .what{display:flex;align-items:center;gap:8px;margin:0 2px 8px;min-width:0}
  .pop .what b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pop .what .x{margin-left:auto;border:0;background:none;color:var(--tx3);cursor:pointer;
    width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none}
  .pop .what .x:hover{background:var(--bg2);color:var(--tx)}
  .field{display:flex;gap:6px;align-items:flex-end;border:1px solid var(--rule2);border-radius:9px;
    padding:5px 5px 5px 10px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
  .field:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
  .field textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--tx);
    font:inherit;font-size:13.5px;min-height:22px;max-height:120px;padding:3px 0;line-height:1.4}
  .field textarea::placeholder{color:var(--tx3)}
  .send{flex:none;width:28px;height:28px;border-radius:7px;border:0;background:var(--acc);color:#fff;
    display:grid;place-items:center;cursor:pointer;transition:opacity .15s,transform .15s}
  .send:not(:disabled):hover{transform:translateY(-1px)}
  .send:disabled{opacity:.3;cursor:default}
  .send svg{width:14px;height:14px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .pop .what .ed{border:0;background:none;color:var(--tx2);cursor:pointer;font-size:12px;
    padding:2px 8px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;flex:none;margin-left:auto}
  .pop .what .ed+.x{margin-left:0}
  .pop .what .ed:hover,.pop .what .ed[aria-pressed=true]{background:var(--bg2);color:var(--tx)}
  .pop .what .ed svg{width:12px;height:12px}
  .ef{display:block;margin:0 0 8px}
  .ef span{display:block;font-size:11px;color:var(--tx3);margin:0 2px 3px}
  .ef input,.ef textarea{width:100%;font:inherit;font-size:13px;line-height:1.4;color:var(--tx);
    background:var(--bg);border:1px solid var(--rule2);border-radius:7px;padding:5px 8px;outline:0;resize:none}
  .ef input:focus,.ef textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 16%,transparent)}
  .erow{display:flex;align-items:center;gap:6px;margin-top:2px}
  .erow .hint{margin:0;flex:1}
  .eerr{color:var(--warn);font-size:12px;margin:0 2px 8px;white-space:pre-wrap}
  .chip{border:1px solid var(--rule);background:var(--bg);border-radius:99px;padding:3px 10px;
    cursor:pointer;font-size:12px;color:var(--tx2);transition:border-color .15s,color .15s,background .15s}
  .chip:hover{color:var(--tx);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--bg))}
  .hint{color:var(--tx3);font-size:11.5px;margin:7px 2px 0}
  .done{display:flex;align-items:center;gap:9px;color:var(--tx2);font-size:13px;padding:1px 2px}
  .done svg{width:18px;height:18px;color:var(--ok);flex:none}

  /* ---- full screen: the page fits the height, the outline beside it ---- */
  :root[data-mode=fullscreen]{--sheet:auto}
  :root[data-mode=fullscreen] body{height:100vh;overflow:hidden}
  :root[data-mode=fullscreen] #app{display:grid;grid-template-columns:260px 1fr;
    grid-template-rows:auto auto 1fr;height:100vh}
  :root[data-mode=fullscreen] .bar{grid-column:1/3;max-width:none;margin:0;padding:10px 16px}
  :root[data-mode=fullscreen] .delta{grid-column:1/3;max-width:none;margin:8px 16px 0}
  :root[data-mode=fullscreen] .side{display:flex}
  :root[data-mode=fullscreen] .body{min-height:0;overflow:auto;padding:20px}
  :root[data-mode=fullscreen] .stage{flex:none}
  :root[data-mode=fullscreen] .sheet img{width:auto;height:calc(100vh - var(--chrome,96px))}
  :root[data-mode=fullscreen] .rail{display:none}
  .side{display:none;flex-direction:column;min-height:0;grid-row:3}
  :root[data-mode=fullscreen] .body{grid-row:3}
  .outline{overflow:auto;padding:10px 8px;flex:1}
  .outline h4{margin:12px 8px 4px;font-size:11px;font-weight:600;letter-spacing:.05em;
    text-transform:uppercase;color:var(--tx3)}
  .ol{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;
    padding:5px 8px;border-radius:7px;cursor:pointer;color:var(--tx2);font-size:13px}
  .ol span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .ol.sec{color:var(--tx);font-weight:500}
  .ol.ent{padding-left:16px}
  .ol:hover{background:var(--bg2);color:var(--tx)}
  .ol[aria-current=true]{background:color-mix(in srgb,var(--acc) 11%,transparent);color:var(--tx)}
  .ol i{width:6px;height:6px;border-radius:50%;background:var(--new);flex:none}
  .side .pages{display:flex;gap:8px;padding:10px;border-top:1px solid var(--rule);overflow:auto}
  .side .pages .thumb{width:56px;flex:none}

  /* ---- keep or undo what Claude changed ---- */
  .btn{border:0;background:color-mix(in srgb,var(--tx) 7%,transparent);border-radius:7px;
    padding:3px 10px;font-size:var(--fs-xs);font-weight:500;cursor:pointer;color:var(--tx);
    white-space:nowrap;transition:background .15s}
  .btn:hover{background:color-mix(in srgb,var(--tx) 12%,transparent)}
  .btn.undo{color:var(--tx)}
  .btn.keep{background:var(--new);color:light-dark(#fff,#10241a)}
  .btn.keep:hover{filter:brightness(1.05)}
  .btn.ghost{background:none;color:var(--tx2)}
  .btn.ghost:hover{background:var(--bg2);color:var(--tx)}
  .btn[aria-busy=true]{opacity:.55;pointer-events:none}
  .delta .acts{display:flex;gap:6px;flex:none;align-items:center}
  .was{margin:0 0 10px;border-radius:9px;background:color-mix(in srgb,var(--new) 7%,var(--bg2));
    border:1px solid color-mix(in srgb,var(--new) 22%,transparent);padding:8px 10px}
  .was .h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;color:var(--tx2)}
  .was .h b{color:var(--new);font-weight:600}
  .was .h .acts{margin-left:auto;display:flex;gap:6px}
  .diff{max-height:9.5em;overflow:auto;font-size:12px;line-height:1.45}
  .diff p{margin:0 0 3px;padding-left:14px;position:relative;white-space:pre-wrap}
  .diff p::before{position:absolute;left:0;font-weight:700}
  .diff .was-l{color:var(--tx3);text-decoration:line-through;
    text-decoration-color:color-mix(in srgb,var(--tx3) 70%,transparent)}
  .diff .was-l::before{content:"−";color:var(--tx3)}
  .diff .now-l{color:var(--tx)}
  .diff .now-l::before{content:"+";color:var(--new)}
  .diff .none{padding:0;font-style:italic;color:var(--tx3)}
  /* A change in its sentence: what went struck through, what came in green. */
  .diff p.w{padding-left:0}
  .diff p.w::before{content:none}
  .diff del{color:var(--tx2);text-decoration:line-through;text-decoration-thickness:1.5px;
    text-decoration-color:color-mix(in srgb,var(--warn) 75%,transparent);
    background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:3px;padding:0 1px}
  .diff ins{text-decoration:none;color:var(--tx);font-weight:500;
    background:color-mix(in srgb,var(--new) 22%,transparent);border-radius:3px;padding:0 1px}
  .diff .gap{color:var(--tx3);padding-left:0;margin:0 0 3px;letter-spacing:.2em}
  .diff .gap::before{content:none}
  .rev .d{display:block;font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
  .rev .d del{color:var(--tx3);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--warn) 75%,transparent)}
  .rev .d ins{text-decoration:none;color:var(--tx);background:color-mix(in srgb,var(--new) 22%,transparent);border-radius:3px;padding:0 1px}
  .rev .wrap{flex:1;min-width:0}
  .revs{margin:-6px auto 12px;max-width:calc(var(--sheet) + 104px);
    border-bottom:1px solid var(--rule);animation:in .2s var(--ease) both}
  .rev{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:var(--fs-sm)}
  .rev+.rev{border-top:1px solid var(--rule)}
  .rev .t{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;flex:none;
    color:var(--new);background:color-mix(in srgb,var(--new) 12%,transparent)}
  .rev .t.del{color:var(--warn);background:var(--warnbg)}
  .rev .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    border:0;background:none;padding:0;text-align:left;cursor:pointer;color:var(--tx)}
  .rev .w:disabled{cursor:default}
  .rev .w:not(:disabled):hover{text-decoration:underline;text-underline-offset:2px}
  :root[data-mode=fullscreen] .revs{grid-column:1/3;max-width:none;margin:8px 16px 0}
  .state{color:var(--tx2);padding:28px 8px;text-align:center}
  /* A page still on its way: the sheet's shape, shimmering. */
  .sheet img:not([src]),.thumb img:not([src]){aspect-ratio:1/1.414;background:
    linear-gradient(100deg,#f3f2ee 40%,#e9e7e1 50%,#f3f2ee 60%) 0 0/200% 100%;
    animation:shim 1.2s linear infinite}
  :root[data-mode=fullscreen] .sheet img:not([src]){width:calc((100vh - var(--chrome,96px)) / 1.414)}
  .btn.dl{display:inline-flex;align-items:center;gap:5px;flex:none}
  .miss{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;padding:24px;text-align:center;color:#3d3c39;font-size:13px;
    background:color-mix(in srgb,#f3f2ee 70%,transparent);animation:in .2s ease-out}
  .miss b{font-weight:600;color:#1f1e1d}
  .miss span{max-width:34ch;line-height:1.45}
  .miss .btn{margin-top:6px;background:#1f1e1d;color:#fff}
  .btn.dl svg{width:13px;height:13px}

  /* ---- an earlier render of the same CV: one line, open on demand ---- */
  .fold{display:flex;align-items:center;gap:12px;width:100%;margin:0 auto;
    max-width:calc(var(--sheet) + 104px);border:0;background:none;padding:6px 0;text-align:left;
    cursor:pointer;color:var(--tx);border-radius:var(--r)}
  .fold img:not([src]){aspect-ratio:1/1.414;background:#f3f2ee}
  .fold img{width:34px;border-radius:2px;background:#fff;flex:none;
    box-shadow:0 0 0 1px var(--rule)}
  .fold .who span{white-space:normal}
  .fold .more{font-size:var(--fs-xs);color:var(--tx2);flex:none;padding:3px 10px;border-radius:7px;
    background:color-mix(in srgb,var(--tx) 6%,transparent)}
  .fold:hover .more{background:color-mix(in srgb,var(--tx) 11%,transparent);color:var(--tx)}
  .delta.old .mark{background:var(--tx3)}
  .seg .sw.lit{display:inline-block;width:9px;height:9px;border-radius:2px;background:#c4efd1;
    box-shadow:inset -2px 0 0 #e0684f;margin-right:5px;vertical-align:-1px}

  /* ---- against the posting (ats_check) ---- */
  .match{margin:0 auto 14px;max-width:calc(var(--sheet) + 104px);padding:0 0 12px;
    border-bottom:1px solid var(--rule);font-size:var(--fs-sm)}
  .mh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .mh b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rate{width:72px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--tx) 10%,transparent);flex:none;overflow:hidden}
  .rate i{display:block;height:100%;background:var(--new);border-radius:9px}
  .mh .n{color:var(--tx2);font-size:var(--fs-xs);white-space:nowrap}
  .reqs{list-style:none;margin:0 0 8px;padding:0}
  .req{display:flex;align-items:flex-start;gap:9px;width:100%;border:0;background:none;text-align:left;
    padding:4px 6px;margin:0 -6px;border-radius:7px;cursor:pointer;color:var(--tx);font-size:var(--fs-sm)}
  .req:hover{background:var(--bg2)}
  .req span{flex:1;min-width:0;line-height:1.4}
  .req em{font-style:normal;color:var(--tx3);font-size:11.5px;white-space:nowrap;padding-top:1px}
  .st{width:14px;height:14px;border-radius:50%;flex:none;margin-top:2px;display:grid;place-items:center}
  .st.met{background:var(--new)}
  .st.met::after{content:"";width:6px;height:3px;border:solid light-dark(#fff,#10241a);border-width:0 0 1.6px 1.6px;
    transform:translateY(-1px) rotate(-45deg)}
  .st.part{background:linear-gradient(90deg,var(--new) 50%,color-mix(in srgb,var(--tx) 14%,transparent) 50%)}
  .st.miss{box-shadow:inset 0 0 0 1.5px var(--warn)}
  .st.unk{box-shadow:inset 0 0 0 1.5px var(--rule2)}
  .more-reqs{border:0;background:none;color:var(--tx2);font-size:12px;cursor:pointer;padding:2px 0;margin-bottom:6px}
  .more-reqs:hover{color:var(--tx);text-decoration:underline}
  .kws{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
  .kl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx3);margin-right:2px}
  .kl+.kw{margin-left:0}
  .kws .sep{width:10px}
  .kw{border:1px solid transparent;border-radius:99px;padding:2px 9px;font-size:12px;cursor:pointer;
    background:color-mix(in srgb,var(--new) 12%,transparent);color:var(--tx)}
  .kw:hover{border-color:var(--new)}
  .kw[aria-pressed=true]{background:var(--new);color:light-dark(#fff,#10241a)}
  .kw.miss{background:none;border:1px dashed var(--rule2);color:var(--tx2)}
  .kw.miss:hover{border-color:var(--acc);border-style:solid;color:var(--tx)}
  .mp{margin:0 0 8px;color:var(--warn);font-size:12.5px}
  .match .hint{margin:8px 0 0}
  .hit.spot{background:color-mix(in srgb,var(--new) 13%,transparent)}
  .hit.spot::before{opacity:1;transform:none;background:var(--new)}
  :root[data-mode=fullscreen] .side .match{margin:10px 12px 0;max-width:none;padding-bottom:10px}
  .skel{max-width:var(--sheet);margin:0 auto;aspect-ratio:1/1.414;border-radius:3px;background:
    linear-gradient(100deg,var(--bg2) 40%,var(--bg3) 50%,var(--bg2) 60%) 0 0/200% 100%;
    animation:shim 1.2s linear infinite}
  @keyframes shim{to{background-position:-200% 0}}
  .err{white-space:pre-wrap;font:12px/1.45 var(--mono);background:var(--bg2);border-radius:var(--r);
    padding:10px 12px;max-height:300px;overflow:auto;color:var(--tx2)}
  .err b{display:block;font:600 13px var(--font);color:var(--tx);margin-bottom:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="bar"></div><div class="skel" aria-label="Rendering"></div></div>
<script>
(() => {
  "use strict";
  const PROTOCOL = "2026-01-26";
  let nextId = 1, host = {caps: {}, ctx: {}}, data = null, page = 0, sel = null, sent = null;
  let showBefore = false, listOpen = false, busy = false;
  /* The page after a change without its marks (After), rather than with
     them (Changes). */
  let plain = false;
  /* A new render arrives with a little motion, once. */
  let fresh = false, settle = 0;
  /* Page images by id, as they arrive; and how full each is. */
  const cache = new Map(), loading = new Map(), fills = new Map();
  /* Pages that did not come: id -> {gone, tries, timer}. A conversation
     opened again can show its views before the client has CV Studio running
     again, so a page that could not be fetched is asked for again, not
     given up on. */
  const missing = new Map();
  /* Set when a later render of this CV exists: {changed}. */
  let earlier = null, unfolded = false, lastCheck = 0;
  /* Editing a block's own text: its fields as the server gave them, what
     has been typed so far, and an error to show. */
  let editing = false, form = null, draft = {}, editErr = "";
  /* Against the posting: the keyword shown on the page, the box's text to
     start from, and whether every requirement is listed. */
  let spot = null, prefill = null, allReqs = false;
  const pending = new Map();
  const $app = document.getElementById("app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const ICON = {
    full: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/></svg>',
    exit: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M13 7H9V3M3 9h4v4M9 7l4.5-4.5M7 9l-4.5 4.5"/></svg>',
    send: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>',
    down: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>',
    ok: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.5"/><path d="m5.2 8.2 1.9 1.9 3.7-4"/></svg>',
    pen: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3 13 5.5 6 12.5H3.5V10z"/></svg>',
    x: '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"/></svg>',
  };
  let seen = false;
  try { seen = localStorage.getItem("cvs-page-coached") === "1"; } catch (e) { /* sandboxed */ }

  /* ---- JSON-RPC over postMessage, to the client that framed this page ---- */
  const send = msg => window.parent.postMessage({jsonrpc: "2.0", ...msg}, "*");
  function request(method, params, ms) {
    const id = nextId++;
    send({id, method, params});
    return new Promise((resolve, reject) => {
      pending.set(id, {resolve, reject});
      /* A client that lost CV Studio may never answer: give up, to try again. */
      if (ms) setTimeout(() => { if (pending.delete(id)) reject(new Error("timeout")); }, ms);
    });
  }
  const notify = (method, params) => send({method, params});

  window.addEventListener("message", ev => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message || "error")) : p.resolve(m.result);
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-input": {
        const p = m.params && m.params.arguments && m.params.arguments.path;
        if (!data && p) $app.querySelector(".bar").innerHTML =
          '<div class="who"><b>Rendering…</b><span><code>' + esc(p) + "</code></span></div>";
        break;
      }
      case "ui/notifications/tool-result": onResult(m.params || {}); break;
      case "ui/notifications/tool-cancelled":
        if (!data) $app.innerHTML = '<div class="state">The render was cancelled.</div>';
        break;
      case "ui/notifications/host-context-changed": applyContext(m.params || {}); break;
      case "ui/resource-teardown": send({id: m.id, result: {}}); break;
      case "ping": send({id: m.id, result: {}}); break;
      default:
        if (m.id != null && m.method) send({id: m.id, error: {code: -32601, message: "Method not found"}});
    }
  });

  function applyContext(ctx) {
    const was = host.ctx.displayMode;
    host.ctx = {...host.ctx, ...ctx};
    const root = document.documentElement;
    if (ctx.theme) root.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) root.style.setProperty(k, v);
    if (ctx.styles && ctx.styles.css && ctx.styles.css.fonts) {
      const st = document.createElement("style"); st.textContent = ctx.styles.css.fonts;
      document.head.appendChild(st);
    }
    root.dataset.mode = host.ctx.displayMode || "inline";
    if (data && host.ctx.displayMode !== was) paint();
  }

  /* ---- the result ---- */
  function onResult(r) {
    let sc = r.structuredContent || r.structured_content;
    if (r.isError || !sc || !sc.shots || !sc.shots.length) {
      const text = (r.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
      $app.innerHTML = r.isError
        ? '<div class="err"><b>The CV did not render.</b>' + esc(text.replace(/^RENDER FAILED\s*/, "")) + "</div>"
        : '<div class="state">' + esc(text || "Nothing to show.") + "</div>";
      return;
    }
    /* Keep, undo or an edit redraws the page without the posting's check:
       keep it, said to be from before. */
    if (!sc.match && data && data.match && data.path === sc.path) sc = {...sc, match: {...data.match, stale: true}};
    data = sc; page = Math.max(0, Math.min((sc.page || 1) - 1, sc.shots.length - 1));
    spot = null; prefill = null;
    sel = null; sent = null; showBefore = false; plain = false; busy = false; earlier = null; unfolded = false;
    fresh = true;
    editing = false; form = null;
    if (sc.first && sc.first.src) { cache.set(sc.first.id, sc.first.src); measure(sc.first.id); }
    if (!review()) listOpen = false;
    /* After a change, open on the first page it touched. */
    const first = changedBands()[0];
    if (first) page = first.page - 1;
    paint();
    /* This is the latest render of the file, as far as this view knows: the
       earlier views of it in the conversation hear so and fold away. */
    try { if (sc.rid) localStorage.setItem("cvs-render:" + sc.path, sc.rid); } catch (e) { /* sandboxed */ }
    check(true).then(() => { if (!earlier) prefetch(); });
  }

  /* ---- pages: the one shown first, the rest when asked for ---- */
  function fetchPage(id) {
    if (cache.has(id)) return Promise.resolve(cache.get(id));
    if (loading.has(id)) return loading.get(id);
    if (!host.caps.serverTools) return Promise.resolve(null);
    const p = request("tools/call", {name: "page_view_data", arguments: {what: "page", page: id}}, 20000).then(r => {
      const im = !r || r.isError ? null : (r.content || []).find(c => c.type === "image");
      if (!im) {
        const text = ((r && r.content) || []).filter(c => c.type === "text").map(c => c.text).join(" ");
        failed(id, /\bgone\b/i.test(text));
        return null;
      }
      const src = "data:" + (im.mimeType || "image/png") + ";base64," + im.data;
      cache.set(id, src);
      const m = missing.get(id);
      if (m) { clearTimeout(m.timer); missing.delete(id); }
      document.querySelectorAll('img[data-h="' + id + '"]').forEach(el => { el.src = src; });
      measure(id);
      showMissing();
      return src;
    }, () => { failed(id, false); return null; }).finally(() => loading.delete(id));
    loading.set(id, p);
    return p;
  }
  /* Asked for again after 2, 4, 8… seconds, then every minute, and at once
     when the conversation is looked at again. A page CV Studio no longer
     keeps is not asked for again: the CV has to be rendered again. */
  function failed(id, gone) {
    const m = missing.get(id) || {tries: 0};
    clearTimeout(m.timer);
    m.gone = gone; m.tries++;
    if (!gone) m.timer = setTimeout(() => fetchPage(id), Math.min(60, 2 ** m.tries) * 1000);
    missing.set(id, m);
    showMissing();
  }
  function retryPages() {
    for (const [id, m] of missing) if (!m.gone) { clearTimeout(m.timer); fetchPage(id); }
  }
  /* Over the page shown, when it did not come: why, and what to do. */
  function showMissing() {
    const sheet = document.getElementById("sheet"), img = document.getElementById("pg");
    if (!sheet || !img) return;
    const m = missing.get(img.dataset.h), box = document.getElementById("miss");
    if (!m || cache.has(img.dataset.h)) { if (box) box.remove(); return; }
    const html = m.gone
      ? "<b>This page is no longer kept.</b><span>Render the CV again to see it.</span>" +
        '<button class="btn" data-miss="render">Render again</button>'
      : m.tries < 2 ? "<b>Loading the page…</b>"
      : "<b>CV Studio is not answering.</b><span>It may still be starting, or the connector is off. " +
        "This view tries again on its own.</span>" + '<button class="btn" data-miss="retry">Try again</button>';
    const el = box || Object.assign(document.createElement("div"), {id: "miss", className: "miss"});
    if (el.innerHTML !== html) el.innerHTML = html;
    if (!box) sheet.appendChild(el);
    const b = el.querySelector("[data-miss]");
    if (b) b.onclick = () => {
      if (b.dataset.miss === "retry") { missing.forEach(x => { x.tries = 1; }); showMissing(); retryPages(); return; }
      b.disabled = true;
      request("ui/message", {role: "user", content: [{type: "text",
        text: "Render " + data.path + " again: its pages are no longer shown."}]}).catch(() => { b.disabled = false; });
    };
  }
  /* The others, one at a time once the first is up: flipping is then
     instant, and the last page can be measured. */
  async function prefetch() {
    for (const id of images().concat(data.shots.slice(-1))) { if (earlier) return; await fetchPage(id); }
  }
  const imgTag = (id, attrs) => '<img data-h="' + esc(id) + '"' + (cache.has(id) ? ' src="' + esc(cache.get(id)) + '"' : "") +
    " " + attrs + ">";

  /* ---- an earlier render: is there a later one? ---- */
  async function check(force) {
    if (!data || !data.rid || !host.caps.serverTools) return;
    const now = Date.now();
    if (!force && now - lastCheck < 15000) return;
    lastCheck = now;
    try {
      const r = await request("tools/call", {name: "page_view_data",
        arguments: {what: "status", path: data.path, rid: data.rid}});
      const st = r && !r.isError && (r.structuredContent || r.structured_content);
      if (st && st.current === false && JSON.stringify(st) !== JSON.stringify(earlier)) {
        earlier = st; sel = null; sent = null; listOpen = false; showBefore = false; paint();
      }
    } catch (e) { /* the client could not ask: stay as it is */ }
  }
  window.addEventListener("storage", e => {
    if (data && e.key === "cvs-render:" + data.path && e.newValue && e.newValue !== data.rid) check(true);
  });
  window.addEventListener("focus", () => { retryPages(); check(false); });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { retryPages(); check(false); }
  });
  /* Scrolled back to: the CV may have been rendered again below since. */
  try {
    new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { retryPages(); check(false); } })
      .observe(document.body);
  } catch (e) { /* no observer: the other signals still fold it */ }

  /* How full each page is, read off the image: the lowest line of ink above
     the footer zone. A last page with a few lines on it is the commonest way
     a CV goes wrong, and it is invisible in the YAML. */
  function measure(id) {
    if (fills.has(id) || !cache.has(id)) return;
    const im = new Image();
    im.onload = () => {
      const w = 120, h = Math.round(im.naturalHeight / im.naturalWidth * w);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const g = c.getContext("2d", {willReadFrequently: true}); g.drawImage(im, 0, 0, w, h);
      const px = g.getImageData(0, 0, w, h).data;
      const ink = y => { for (let x = 0; x < w; x++) { const k = (y * w + x) * 4;
        if (px[k] + px[k + 1] + px[k + 2] < 600) return true; } return false; };
      const limit = Math.floor(h * 0.93);       /* below this is page numbers and footers */
      let last = 0, first = -1;
      for (let y = 0; y < limit; y++) if (ink(y)) { if (first < 0) first = y; last = y; }
      fills.set(id, first < 0 ? 0 : Math.min(1, (last - first) / (limit - first || 1)));
      if (data && (id === data.shots[data.shots.length - 1] || id === (data.marked || [])[data.shots.length - 1])) paintFacts();
    };
    im.src = cache.get(id);
  }

  /* ---- what is changed, and where it shows ---- */
  const key = b => b.k + "|" + b.name + "|" + b.i;
  const same = (a, b) => !!a && !!b && key(a) === key(b);
  const changedKeys = () => new Set(((data.changes && data.changes.blocks) || []).map(key));
  const changedBands = () => { const ks = changedKeys(); return (data.map || []).filter(b => ks.has(key(b))); };
  const bandsOn = p => (data.map || []).filter(b => b.page === p + 1);

  /* The changes an AI client made that nobody has kept or undone, as the
     app's review holds them; each has the block it is on the page, if any. */
  const review = () => (data && data.changes && data.changes.review) || null;
  const canAct = () => !!(review() && host.caps.serverTools && !earlier);
  const unitFor = b => { const r = review(); return r ? r.units.find(u => u.block && key(u.block) === key(b)) : null; };

  function deltaHtml() {
    const c = data.changes;
    if (!c) return "";
    const r = review(), n = new Set(changedBands().map(key)).size, bits = [];
    if (r) {
      const total = r.units.length;
      bits.push("<b>" + esc(r.agent || "Claude") + "</b> changed " + total + (total === 1 ? " thing" : " things"));
      if (n && n < total) bits.push(n + " on the page");
    } else {
      if (n) bits.push("<b>" + n + "</b> " + (n === 1 ? "part changed" : "parts changed"));
      if (c.removed) bits.push("<b>" + esc(c.removed) + "</b> removed");
      if (c.design) bits.push("the design changed");
      if (c.page && !bits.length) bits.push("the letter changed");
      if (!bits.length) bits.push("small changes");
    }
    const canCompare = data.before && data.before.length, lit = marked();
    const mode = showBefore ? "before" : lit && !plain ? "changes" : "after";
    const opt = (v, label, title) => '<button data-cmp="' + v + '" aria-pressed="' + (mode === v) + '" title="' + title + '">' + label + "</button>";
    return '<div class="delta" role="status"><i class="mark"></i><span>' +
      (r ? "" : "Since the last render: ") + bits.join(", ") + "</span>" +
      (canCompare || lit ? '<div class="seg" role="group" aria-label="Compare">' +
        (canCompare ? opt("before", "Before", "The page before the change") : "") +
        (lit ? opt("changes", '<i class="sw lit"></i>Changes', "What changed, marked on the page: new words in green, a red stroke where words were cut") : "") +
        opt("after", "After", "The page as it prints") + "</div>" : "") +
      (r && canAct() ? '<div class="acts"><button class="btn ghost" id="revlist" aria-expanded="' + listOpen +
        '">' + (listOpen ? "Hide list" : "Review") + '</button><button class="btn undo" data-act="undo" data-ids="*">Undo all</button>' +
        '<button class="btn keep" data-act="keep" data-ids="*">Keep all</button></div>' : "") + "</div>" +
      (r && canAct() && listOpen ? revsHtml(r) : "");
  }

  function revsHtml(r) {
    return '<div class="revs" id="revs">' + r.units.map(u =>
      '<div class="rev"><span class="t' + (u.tag === "del" || (u.kind === "section" && !u.after) ? " del" : "") + '">' +
        esc(u.label) + '</span><span class="wrap"><button class="w" data-goto="' + esc(u.block ? key(u.block) : "") + '"' +
        (u.block ? "" : " disabled") + ' title="' + esc(u.where) + '">' + esc(u.where) + "</button>" +
        (u.before && u.after ? '<span class="d">' + briefDiff(u.before, u.after) + "</span>" : "") + "</span>" +
        '<button class="btn undo" data-act="undo" data-ids="' + esc(u.id) + '">Undo</button>' +
        '<button class="btn keep" data-act="keep" data-ids="' + esc(u.id) + '">Keep</button></div>').join("") + "</div>";
  }

  /* ---- the bar ---- */
  function whoHtml() {
    const d = data, file = String(d.path || "").split("/").pop();
    const title = d.title || file.replace(/\.(ya?ml|md)$/, "").replace(/[-_]+/g, " ");
    const sub = d.subtitle ? esc(d.subtitle) + " · " : "";
    const j = d.job, ini = s => String(s || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    /* Whose it is and what it is for: the company it is tailored to when
       it is attached to an application, else the person's initials. */
    return (full() ? "" : '<span class="avatar">' + (j && j.logo ? '<img alt="" src="' + esc(j.logo) + '">' :
        esc(ini(j && j.company ? j.company : title))) + "</span>") +
      '<div class="who"><b title="' + esc(title) + '">' + esc(title) + '</b><span title="' + esc(d.path) +
      '">' + (j && j.company && !full() ? '<em>For ' + esc(j.company) + (j.title ? ", " + esc(j.title) : "") + "</em> · " : sub) +
      "<code>" + esc(file) + "</code></span></div>";
  }
  /* The verdict and the numbers under the name: what this page means in one
     line, then pages, words and how full the last page is. Inline only:
     full screen keeps the compact facts in its bar. */
  function lastFill() {
    const d = data, n = d.shots.length - 1;
    return fills.has(d.shots[n]) ? fills.get(d.shots[n]) : fills.get((d.marked || [])[n]);
  }
  function summaryHtml() {
    const d = data, f = lastFill(), r = review(), n = r ? r.units.length : 0;
    const known = f != null && d.pages === d.shots.length;
    const kind = d.letter ? "letter" : "CV";
    const pg = p => p === 1 ? "one page" : p + " pages";
    let say, act = "";
    const changed = n ? " " + esc(r.agent || "Claude") + " changed " + n + (n === 1 ? " thing" : " things") +
      ": check " + (n === 1 ? "it" : "them") + ", then it is ready to send." : "";
    if (known && !d.letter && d.pages > 1 && f < 0.3) {
      say = d.pages + " pages, and the last is only " + Math.max(1, Math.round(f * 100)) + "% full: fitting it on " +
        pg(d.pages - 1) + " is a quick win.";
      act = '<button class="btn go" id="fit">Fit on ' + pg(d.pages - 1) + "</button>";
    } else if (d.pages === 1) {
      say = "Fits on one page" + (n ? "." + changed : ", ready to send.");
    } else {
      say = "The " + kind + " runs to " + pg(d.pages) + (known ? ", every one of them full" : "") + "." + changed;
    }
    const meter = known ? '<span class="meter" aria-hidden="true"><i style="width:' + Math.max(3, Math.round(f * 100)) + '%"></i></span>' : "";
    return '<div class="verdict"><p>' + say + "</p>" + act + "</div>" +
      '<div class="pstats"><div><b>' + esc(d.pages) + "</b><span>" + (d.pages === 1 ? "page" : "pages") + "</span></div>" +
      (d.words ? "<div><b>" + esc(Number(d.words).toLocaleString()) + "</b><span>words" + (d.letter ? "" : " an ATS reads") + "</span></div>" : "") +
      "<div><b>" + (known ? Math.round(f * 100) + "%" : "–") + "</b><span>of the " + (d.pages === 1 ? "page" : "last page") + " used</span>" + meter + "</div>" +
      (d.job && d.job.company ? '<div class="for"><b>' + esc(d.job.company) + "</b><span>" + esc(d.job.title || "the application") + "</span></div>" : "") +
      "</div>";
  }
  function factsHtml() {
    const d = data, out = [];
    out.push('<span class="fact">' + (d.pages === 1 ? "1 page" : esc(d.pages) + " pages") + "</span>");
    if (d.words) out.push('<i class="dot"></i><span class="fact">' + esc(d.words) + " words</span>");
    const n = d.shots.length - 1;
    const lastFill = fills.has(d.shots[n]) ? fills.get(d.shots[n]) : fills.get((d.marked || [])[n]);
    if (lastFill != null && d.pages === d.shots.length && !d.letter) {
      if (d.pages > 1 && lastFill < 0.3)
        out.push('<span class="badge warn" title="The last page is mostly empty">Last page ' +
          Math.max(1, Math.round(lastFill * 100)) + '% full · <button id="fit">Fit on ' +
          (d.pages - 1) + (d.pages > 2 ? " pages" : " page") + "</button></span>");
      else if (d.pages === 1) out.push('<span class="badge ok">Fits on one page</span>');
    }
    return out.join("");
  }
  function paintFacts() {
    const s = document.getElementById("stats");
    if (s) s.innerHTML = factsHtml();
    const m = document.getElementById("summary");
    if (m) m.innerHTML = summaryHtml();
    wireFit();
  }
  function wireFit() {
    const fit = document.getElementById("fit");
    if (fit) fit.onclick = () => ask({k: "doc", name: null, i: null, label: "The whole CV"},
      "Fit it on " + (data.pages - 1) + (data.pages > 2 ? " pages" : " page") +
      " without losing anything that matters for this job");
  }

  const modes = () => host.ctx.availableDisplayModes || [];
  const full = () => host.ctx.displayMode === "fullscreen";
  const marked = () => !!(data.marked && data.marked.length === data.shots.length);
  const images = () => (showBefore && data.before ? data.before : marked() && !plain ? data.marked : data.shots);
  const canDownload = () => !!(host.caps.downloadFile && host.caps.serverTools && data.pdf && !earlier);

  function thumbs() {
    const imgs = images();
    if (imgs.length < 2) return "";
    return imgs.map((id, i) => '<button class="thumb" data-page="' + i + '"' +
      (i === page ? ' aria-current="page"' : "") + ' aria-label="Page ' + (i + 1) + '">' +
      imgTag(id, 'alt=""') + (i + 1) + "</button>").join("");
  }

  function outline() {
    const seenK = new Set(), rows = [], ks = changedKeys();
    (data.map || []).forEach(b => { if (!seenK.has(key(b))) { seenK.add(key(b)); rows.push(b); } });
    if (!rows.length) return '<p class="state" style="padding:16px 8px;text-align:left">Nothing on this page to point at.</p>';
    return rows.map(b => b.k === "section" ? "<h4>" + esc((b.label || "").split(" · ")[0]) + "</h4>"
      : '<button class="ol ' + (b.k === "header" ? "sec" : "ent") + '" data-key="' + esc(key(b)) + '"' +
        (same(b, sel) ? ' aria-current="true"' : "") + "><span>" +
        esc(b.k === "header" ? "Header" : (b.label || "").split(" · ").slice(1).join(" · ") || b.label) +
        "</span>" + (ks.has(key(b)) ? '<i title="Changed"></i>' : "") + "</button>").join("");
  }

  function paint() {
    const d = data, imgs = images(), n = imgs.length;
    if (page >= n) page = n - 1;
    if (earlier && !unfolded) return paintFolded();
    if (fresh) {
      fresh = false;
      $app.classList.add("anim");
      clearTimeout(settle);
      settle = setTimeout(() => $app.classList.remove("anim"), 1400);
    }
    const canFull = modes().includes("fullscreen");
    $app.innerHTML =
      '<div class="bar">' + whoHtml() + (full() ? '<div class="facts" id="stats">' + factsHtml() + "</div>" : "") +
        (canDownload() ? '<button class="btn dl" id="dl" title="Download the PDF of this CV" aria-label="Download the PDF">' +
          ICON.down + "PDF</button>" : "") +
        (canFull ? '<button class="icon" id="mode" title="' + (full() ? "Back to the chat" : "Full screen") +
          '" aria-label="' + (full() ? "Back to the chat" : "Full screen") + '">' + (full() ? ICON.exit : ICON.full) +
          "</button>" : "") + "</div>" +
      (full() || earlier ? "" : '<div class="summary" id="summary">' + summaryHtml() + "</div>") +
      (earlier ? '<div class="delta old" role="status"><i class="mark"></i><span>An earlier version: ' +
        esc(sinceText()) + '. The latest is further down.</span><button class="btn ghost" id="refold">Fold</button></div>'
        : deltaHtml()) +
      (d.match && !full() ? matchHtml() : "") +
      '<aside class="side">' + (d.match && full() ? matchHtml() : "") + '<div class="outline" id="outline">' + outline() + "</div>" +
        (n > 1 ? '<div class="pages">' + thumbs() + "</div>" : "") + "</aside>" +
      '<div class="body"><div class="stage" id="stage"><div class="sheet" id="sheet">' + imgTag(imgs[page],
        'id="pg" alt="Page ' + (page + 1) + " of " + esc(d.pages) + (showBefore ? ", before the change" : "") + '"') +
        (showBefore ? '<span class="ribbon">Before</span>' : "") + "</div>" +
        '<div class="tag" id="tag"></div>' +
        (!seen && !showBefore && (d.map || []).length
          ? '<div class="coach" id="coach">Click any part of the page to change it</div>' : "") +
      "</div>" + (n > 1 ? '<div class="rail">' + thumbs() + "</div>" : "") + "</div>" +
      (d.pages > d.shots.length ? '<p class="state" style="padding:8px">Showing the first ' +
        d.shots.length + " of " + esc(d.pages) + " pages.</p>" : "");
    if (full()) {
      const top = document.querySelector(".bar").offsetHeight +
        ((document.querySelector(".delta") || {}).offsetHeight || 0);
      document.documentElement.style.setProperty("--chrome", (top + 52) + "px");
    }

    const img = document.getElementById("pg");
    if (img.complete && img.naturalHeight) hits(); else img.onload = hits;
    if (!cache.has(imgs[page])) {
      if (!host.caps.serverTools) img.alt = "This client cannot load the pages. Open the PDF instead.";
      else fetchPage(imgs[page]);
    }
    showMissing();
    /* The pages before a change are fetched only when asked to compare. */
    imgs.forEach(id => fetchPage(id));
    const dl = document.getElementById("dl");
    if (dl) dl.onclick = () => download(dl);
    const rf = document.getElementById("refold");
    if (rf) rf.onclick = () => { unfolded = false; sel = null; sent = null; paint(); };
    document.querySelectorAll("[data-page]").forEach(t => t.onclick = () => { page = +t.dataset.page; paint(); });
    document.querySelectorAll(".ol[data-key]").forEach(o => o.onclick = () => {
      const b = (data.map || []).find(x => key(x) === o.dataset.key);
      if (b) { showBefore = false; page = b.page - 1; select(b); }
    });
    document.querySelectorAll("[data-cmp]").forEach(x => x.onclick = () => {
      showBefore = x.dataset.cmp === "before"; plain = x.dataset.cmp === "after"; sel = null; paint();
    });
    wireActs(document);
    const rl = document.getElementById("revlist");
    if (rl) rl.onclick = () => { listOpen = !listOpen; paint(); };
    document.querySelectorAll("[data-goto]").forEach(g => g.onclick = () => {
      const b = (data.map || []).find(x => key(x) === g.dataset.goto);
      if (b) { showBefore = false; page = b.page - 1; select(b); }
    });
    wireFit();
    wireMatch();
    const mode = document.getElementById("mode");
    if (mode) mode.onclick = async () => {
      try {
        const r = await request("ui/request-display-mode", {mode: full() ? "inline" : "fullscreen"});
        applyContext({displayMode: (r && r.mode) || host.ctx.displayMode});
      } catch (e) { /* the client said no */ }
    };
  }

  function sinceText() {
    const c = earlier && earlier.changed;
    return c == null ? "rendered again since" : c === 0 ? "rendered again since, with the same content"
      : c + (c === 1 ? " change since" : " changes since");
  }

  /* An earlier render, folded: the page as a stamp, what has happened
     since, and a way to look at it again. */
  function paintFolded() {
    const d = data, file = String(d.path || "").split("/").pop();
    const title = d.title || file.replace(/\.(ya?ml|md)$/, "").replace(/[-_]+/g, " ");
    $app.innerHTML = '<button class="fold" id="unfold" aria-label="Show this earlier version">' +
      (d.first ? imgTag(d.first.id, 'alt=""') : "") +
      '<span class="who"><b>' + esc(title) + "</b><span>Earlier version · " + esc(sinceText()) + "</span></span>" +
      '<span class="more">Show</span></button>';
    document.getElementById("unfold").onclick = () => { unfolded = true; paint(); };
    if (d.first) fetchPage(d.first.id);
  }

  /* The PDF, handed over by the client as a file: the last step of an
     application, without opening the app or the folder. */
  async function download(btn) {
    if (btn.getAttribute("aria-busy") === "true") return;
    btn.setAttribute("aria-busy", "true");
    try {
      const r = await request("tools/call", {name: "page_view_data", arguments: {what: "pdf", path: data.pdf}});
      const item = r && !r.isError && (r.content || []).find(c => c.type === "resource");
      if (!item) throw new Error(((r && r.content || [])[0] || {}).text || "no PDF");
      await request("ui/download-file", {contents: [item]});
    } catch (e) {
      flash("The PDF could not be downloaded: " + clean(e.message, 160) + ".");
    } finally {
      btn.removeAttribute("aria-busy");
    }
  }

  /* One target per block: the strip of the page it owns, hugging the text
     column when the map knows where it is. Same geometry as the editor's
     page in the app. None on the page before a change: that one is to look at. */
  function hits() {
    if (showBefore) return;
    const sheet = document.getElementById("sheet"), img = document.getElementById("pg");
    if (!sheet || !img.naturalHeight) return;
    const box = data.box || null;
    const H = (box && box.page_height) || img.naturalHeight / 2;
    const W = (box && box.page_width) || img.naturalWidth / 2;
    const pad = 4;
    const left = box ? Math.max(0, (box.x0 - pad) / W * 100) : 0;
    const right = box ? Math.max(0, (W - box.x1 - pad) / W * 100) : 0;
    const pct = y => Math.max(0, Math.min(H, y)) / H * 100;
    const tag = document.getElementById("tag"), ks = changedKeys();
    bandsOn(page).forEach(b => {
      const top = pct(b.y0), bottom = b.y1 == null ? 100 : pct(b.y1);
      if (bottom - top <= 0.4) return;
      const el = document.createElement("button");
      const isNew = ks.has(key(b));
      el.className = "hit" + (same(b, sel) ? " sel" : "") + (same(b, sent) ? " sent" : "") + (isNew ? " new" : "") +
        (spotted().has(key(b)) ? " spot" : "");
      el.style.cssText = "top:" + top + "%;height:" + (bottom - top) + "%;left:" + left + "%;right:" + right + "%";
      el.dataset.key = key(b);
      el.setAttribute("aria-label", "Change " + (b.label || "this block") + (isNew ? " (changed)" : ""));
      const show = () => {
        if (same(b, sel)) { tag.style.display = "none"; return; }
        tag.innerHTML = esc(b.label || "") + (isNew ? "<i>Changed</i>" : "");
        tag.style.display = b.label ? "block" : "none";
        tag.style.top = el.offsetTop + "px"; tag.style.left = el.offsetLeft + "px";
      };
      el.onmouseenter = show; el.onfocus = show;
      el.onmouseleave = el.onblur = () => { tag.style.display = "none"; };
      el.onclick = () => select(b);
      el.ondblclick = () => { if (canEdit(b)) { select(b); startEdit(); } };
      sheet.appendChild(el);
    });
    if (sel && sel.k !== "doc") openPop(); else if (sent && sent.k !== "doc") openSent();
  }

  /* ---- what reaches the model ----
     Text from the CV goes into what Claude reads, and a CV can carry text
     from an imported PDF or a posting. So it goes in as one short line of
     plain words: no line breaks or control characters to start a new
     "instruction", nothing long enough to carry one. */
  const clean = (s, n = 80) => {
    s = String(s ?? "").replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]+/g, " ")
      .replace(/\s+/g, " ").trim();
    return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
  };
  const name = b => clean(b.label) || "this part of the CV";
  const yamlKey = s => String(s ?? "").replace(/[^\w.-]/g, "");   /* a YAML key, nothing else */

  function where(b) {
    if (b.k === "doc") return "the whole document";
    if (b.k === "para") return "paragraph " + ((+b.i || 0) + 1) + " of the body (paragraphs are separated by blank lines)";
    if (b.k === "header" && data.letter) return "the letter's front matter: to, date, place and subject";
    if (b.k === "header") return "cv.name, cv.headline and the contact details";
    if (b.k === "section") return "cv.sections." + yamlKey(b.name);
    return "cv.sections." + yamlKey(b.name) + "[" + (+b.i || 0) + "]";
  }

  /* What Claude is told, out of sight of the chat: the file, the exact place,
     and what to do after. Each update replaces the one before. */
  function tellModel(b, asked) {
    if (!host.caps.updateModelContext) return Promise.resolve(false);
    const path = clean(data.path, 200);
    const doc = data.letter ? "letter" : "CV";
    const text = "CV Studio page view: the user " + (asked ? "asked for a change to" : "selected") +
      (b.k === "doc" ? " the whole " + doc : " the block \"" + name(b) + "\"") + " in " + path +
      (b.k === "doc" ? "" : ", at " + where(b)) + ". " +
      (asked ? "Their next message says what to change. " + (b.k === "doc" ? "" : "Edit only that block, then ") +
               "call render_cv on " + path + " so they see the new page."
             : "If their next message says \"this\", it means that block.");
    return request("ui/update-model-context", {content: [{type: "text", text}]}).then(() => true, () => false);
  }

  /* Suggestions that fit the block: what you would actually ask of a job,
     a summary, a list of skills. */
  function chipsFor(b) {
    const s = String(b.name || "").toLowerCase();
    if (b.k === "para") return ["Make it shorter", "More specific to the company", "Warmer", "Remove it"];
    if (b.k === "header" && data.letter) return ["Address it to the hiring manager", "Sharpen the subject line"];
    if (b.k === "header") return ["Sharpen the headline for this job", "Make it shorter"];
    if (b.k === "section") return ["Move it up", "Move it down", "Shorten this section", "Remove the section"];
    if (/summary|profile|about|objective/.test(s)) return ["Tailor it to the posting", "Lead with a number", "Make it shorter"];
    if (/experience|work|employment|project|volunteer/.test(s))
      return ["Quantify the impact", "Stronger verbs", "Keep the 3 best bullets", "Match the posting"];
    if (/skill|technolog|tool|stack/.test(s)) return ["Match the posting's keywords", "Group them better", "Cut the weakest"];
    if (/education|certif|course/.test(s)) return ["Make it one line", "Remove it"];
    return ["Make it shorter", "Make it stronger", "Remove it"];
  }

  function select(b) {
    if (!same(b, sel)) { editing = false; form = null; editErr = ""; }
    sel = b; sent = null;
    if (!seen) { seen = true; try { localStorage.setItem("cvs-page-coached", "1"); } catch (e) {} }
    paint();
    tellModel(b, false);
  }

  function close() { sel = null; sent = null; editing = false; form = null; paint(); }

  /* Next to the block: under it when there is room, over it otherwise,
     lined up with the text rather than spanning the sheet. */
  function place(pop) {
    const stage = document.getElementById("stage");
    const hit = stage.querySelector('.hit[data-key="' + CSS.escape(key(sel || sent)) + '"]');
    if (!hit) return;
    const sheetH = stage.querySelector(".sheet").offsetHeight;
    const below = hit.offsetTop + hit.offsetHeight + 8;
    const h = pop.offsetHeight;
    const left = Math.max(8, Math.min(hit.offsetLeft - 6, stage.offsetWidth - pop.offsetWidth - 8));
    pop.style.left = left + "px";
    if (below + h <= sheetH + 24 || hit.offsetTop - h - 8 < 0) pop.style.top = below + "px";
    else pop.style.top = (hit.offsetTop - h - 8) + "px";
    /* A box that runs past the page makes room for itself: the client sizes
       the frame to what is in it. */
    stage.style.paddingBottom = Math.max(0, pop.offsetTop + h - sheetH + 12) + "px";
  }

  function openPop() {
    const stage = document.getElementById("stage"), b = sel;
    const coach = document.getElementById("coach"); if (coach) coach.remove();
    const canSend = !!host.caps.message;
    const pop = document.createElement("div");
    pop.id = "ask"; pop.className = "pop"; pop.setAttribute("role", "dialog");
    pop.setAttribute("aria-label", "Change " + (b.label || "this block"));
    const u = unitFor(b);
    const head = '<div class="what"><b title="' + esc(b.label) + '">' + esc(b.label || "This block") + "</b>" +
      (canEdit(b) ? '<button class="ed" id="edit" aria-pressed="' + editing + '" title="Fix the text yourself, without Claude">' +
        ICON.pen + (editing ? "Editing" : "Edit") + "</button>" : "") +
      '<button class="x" id="clear" aria-label="Close">' + ICON.x + "</button></div>";
    if (editing) {
      pop.innerHTML = head + editHtml();
      stage.appendChild(pop);
      place(pop);
      wireEdit(pop);
      return;
    }
    pop.innerHTML = head +
      (u && canAct() ? '<div class="was"><div class="h"><b>' + esc(u.tag === "ins" ? "Added" : "Changed") + " by " +
        esc(review().agent || "Claude") + '</b><div class="acts"><button class="btn undo" data-act="undo" data-ids="' +
        esc(u.id) + '">Undo</button><button class="btn keep" data-act="keep" data-ids="' + esc(u.id) +
        '">Keep</button></div></div>' + diffHtml(u.before, u.after) + "</div>" : "") +
      (canSend
        ? '<div class="field"><textarea id="msg" rows="1" placeholder="What should change here?"></textarea>' +
          '<button class="send" id="go" aria-label="Send to Claude" disabled>' + ICON.send + "</button></div>" +
          '<div class="chips">' + chipsFor(b).map(c => '<button class="chip" data-chip="' + esc(c) + '">' +
            esc(c) + "</button>").join("") + "</div>"
        : '<p class="hint" style="margin:0 2px">Say in the chat what should change here: Claude knows which part you mean.</p>');
    stage.appendChild(pop);
    place(pop);
    wireActs(pop);
    document.getElementById("clear").onclick = close;
    const ed = document.getElementById("edit");
    if (ed) ed.onclick = startEdit;
    const msg = document.getElementById("msg");
    if (!msg) return;
    const go = document.getElementById("go");
    const grow = () => { msg.style.height = "auto"; msg.style.height = Math.min(120, msg.scrollHeight) + "px";
      go.disabled = !msg.value.trim(); place(pop); };
    msg.oninput = grow;
    msg.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(msg.value); }
      if (e.key === "Escape") close();
    };
    go.onclick = () => submit(msg.value);
    pop.querySelectorAll("[data-chip]").forEach(c => c.onclick = () => submit(c.dataset.chip));
    if (prefill) { msg.value = prefill; prefill = null; grow(); }
    msg.focus({preventScroll: true});
    if (msg.value) msg.setSelectionRange(msg.value.length, msg.value.length);
  }

  /* ---- against the posting ----
     Every requirement and keyword is posting text, shown here as text and
     sent nowhere until the user sends a message with it in their words. */
  const bandFor = blk => blk && (data.map || []).find(x => key(x) === key(blk));
  function spotted() {
    const m = data && data.match;
    if (!m || !spot) return new Set();
    const keys = new Set();
    (m.found || []).filter(f => spot.includes(f.key)).forEach(f => (f.where || []).forEach(w => keys.add(key(w))));
    return keys;
  }

  function matchHtml() {
    const m = data.match, found = m.found || [], missing = m.missing || [], reqs = m.requirements || [];
    const job = [m.title, m.company].filter(Boolean).join(" at ");
    if (!m.has_posting) return '<section class="match"><div class="mh"><b>' + esc(job ? "Against " + job : "Against the posting") +
      '</b></div><p class="hint" style="margin:0">There is no posting saved' + (job ? " with this application" : "") +
      ", so there is nothing to match against. Add the posting to the application, then ask Claude to check again.</p>" +
      problemsHtml(m) + "</section>";
    const state = q => !q.terms.length ? "unk" : q.found.length === q.terms.length ? "met" : q.found.length ? "part" : "miss";
    const shown = allReqs ? reqs : reqs.slice(0, 5);
    return '<section class="match" aria-label="Against the posting"><div class="mh"><b title="' + esc(job) + '">' +
        esc(job ? "Against " + job : "Against the posting") + '</b><span class="rate" aria-hidden="true"><i style="width:' +
        (+m.rate || 0) + '%"></i></span><span class="n">' + found.length + " of " + (+m.total || 0) + " keywords</span></div>" +
      (m.stale ? '<p class="hint" style="margin:0 0 8px">Checked before your last change. Ask Claude to check again.</p>' : "") +
      problemsHtml(m) +
      (shown.length ? '<ul class="reqs">' + shown.map((q, i) => '<li><button class="req" data-req="' + i + '"><i class="st ' +
        state(q) + '" title="' + {met: "In your CV", part: "Partly in your CV", miss: "Not in your CV", unk: "Yours to judge"}[state(q)] +
        '"></i><span>' + esc(q.text) + "</span>" + (state(q) === "met" ? "<em>Show</em>" : "<em>Ask</em>") + "</button></li>").join("") + "</ul>" +
        (reqs.length > 5 ? '<button class="more-reqs" id="allreqs">' + (allReqs ? "Fewer" : "All " + reqs.length + " requirements") + "</button>" : "") : "") +
      '<div class="kws">' + (found.length ? '<span class="kl">In your CV</span>' + found.map((f, i) =>
          '<button class="kw" data-kw="' + i + '" aria-pressed="' + !!(spot && spot.length === 1 && spot[0] === f.key) +
          '" title="Show where">' + esc(f.term) + "</button>").join("") : "") +
        (missing.length ? (found.length ? '<span class="sep"></span>' : "") + '<span class="kl">Missing</span>' +
          missing.map((f, i) => '<button class="kw miss" data-miss="' + i + '" title="Ask Claude to add it, where it is true">' +
            esc(f.term) + "</button>").join("") : "") + "</div>" +
      '<p class="hint">Picked from the posting by a heuristic. Add a keyword only where it is true of you.</p></section>';
  }
  function problemsHtml(m) {
    const p = m.problems || [];
    return p.length ? '<p class="mp">' + (p.length === 1 ? "A parsing problem: " : p.length + " parsing problems: ") +
      esc(p.join("; ")) + "</p>" : "";
  }

  /* Show where it is: the page it is on, its blocks lit. */
  function showSpot(keys) {
    const keysOn = spot && JSON.stringify(spot) === JSON.stringify(keys);
    spot = keysOn ? null : keys; sel = null; sent = null; showBefore = false; editing = false;
    const first = [...spotted()].map(k => (data.map || []).find(x => key(x) === k)).filter(Boolean)
      .sort((a, b) => a.page - b.page || a.y0 - b.y0)[0];
    if (first) page = first.page - 1;
    paint();
  }
  /* Ask for it: the box on the block it belongs in, with a start the user
     finishes and sends. */
  function askFor(text) {
    const m = data.match, b = bandFor(m.best) || {k: "doc", name: null, i: null, label: "The whole CV"};
    spot = null; showBefore = false;
    if (b.page) page = b.page - 1;
    prefill = text;
    if (b.k === "doc") { sel = b; paint(); return; }
    select(b);
  }
  function wireMatch() {
    const m = data.match;
    if (!m) return;
    document.querySelectorAll("[data-kw]").forEach(x => x.onclick = () => showSpot([m.found[+x.dataset.kw].key]));
    document.querySelectorAll("[data-miss]").forEach(x => x.onclick = () =>
      askFor("Add evidence for " + clean(m.missing[+x.dataset.miss].term, 40) + ", only what I have really done"));
    document.querySelectorAll("[data-req]").forEach(x => x.onclick = () => {
      const q = m.requirements[+x.dataset.req];
      if (q.terms.length && q.found.length === q.terms.length) showSpot(q.found);
      else askFor("Show that I meet this, only with what I have really done: " + clean(q.text, 140));
    });
    const all = document.getElementById("allreqs");
    if (all) all.onclick = () => { allReqs = !allReqs; paint(); };
  }

  /* ---- the user's own small edit: a typo, a date, a word ---- */
  const canEdit = b => !!(b && host.caps.serverTools && !earlier && !showBefore &&
    (b.k === "entry" || b.k === "header" || b.k === "para"));

  async function startEdit() {
    const b = sel;
    if (!canEdit(b)) return;
    if (editing) { editing = false; form = null; editErr = ""; paint(); return; }
    editing = true; form = null; editErr = ""; draft = {};
    paint();
    try {
      const r = await request("tools/call", {name: "page_view_data",
        arguments: {what: "fields", path: data.path, block: {k: b.k, name: b.name, i: b.i}}});
      const f = r && !r.isError && (r.structuredContent || r.structured_content);
      if (!f) throw new Error(((r && r.content || [])[0] || {}).text || "it could not be read");
      if (!same(b, sel) || !editing) return;
      form = f; f.fields.forEach(x => { draft[x.key] = x.value; });
    } catch (e) {
      editErr = clean(e.message, 300);
    }
    paint();
  }

  function editHtml() {
    if (editErr && !form) return '<p class="eerr">' + esc(editErr) + "</p>";
    if (!form) return '<p class="hint" style="margin:2px">Reading it…</p>';
    return '<div class="edit">' + form.fields.map(f => '<label class="ef"><span>' + esc(f.label) + "</span>" +
        (f.multi ? '<textarea data-k="' + esc(f.key) + '" rows="' + Math.min(8, String(draft[f.key]).split("\n").length + 1) + '">' +
          esc(draft[f.key]) + "</textarea>" : '<input data-k="' + esc(f.key) + '" value="' + esc(draft[f.key]) + '">') +
        "</label>").join("") +
      (editErr ? '<p class="eerr">' + esc(editErr) + "</p>" : "") +
      '<div class="erow"><p class="hint">Saved as your edit. Claude is told.</p>' +
      '<button class="btn ghost" id="ecancel">Cancel</button><button class="btn keep" id="esave">Save</button></div></div>';
  }

  function wireEdit(pop) {
    document.getElementById("clear").onclick = close;
    document.getElementById("edit").onclick = startEdit;
    const fields = [...pop.querySelectorAll("[data-k]")];
    const grow = t => { if (t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = Math.min(220, t.scrollHeight + 2) + "px"; } };
    fields.forEach(t => {
      grow(t);
      t.oninput = () => { draft[t.dataset.k] = t.value; grow(t); place(pop); };
      t.onkeydown = e => {
        if (e.key === "Escape") { e.preventDefault(); editing = false; form = null; paint(); }
        else if (e.key === "Enter" && (t.tagName === "INPUT" || e.metaKey || e.ctrlKey)) { e.preventDefault(); saveEdit(); }
      };
    });
    const c = document.getElementById("ecancel"), s = document.getElementById("esave");
    if (c) c.onclick = () => { editing = false; form = null; paint(); };
    if (s) s.onclick = saveEdit;
    if (fields[0]) { fields[0].focus({preventScroll: true}); }
    place(pop);
  }

  async function saveEdit() {
    const b = sel, s = document.getElementById("esave");
    if (!form || !b || (s && s.getAttribute("aria-busy") === "true")) return;
    const values = {};
    form.fields.forEach(f => { if (draft[f.key] !== f.value) values[f.key] = draft[f.key]; });
    if (!Object.keys(values).length) { editing = false; form = null; paint(); return; }
    if (s) { s.setAttribute("aria-busy", "true"); s.textContent = "Saving…"; }
    try {
      const r = await request("tools/call", {name: "edit_on_page", arguments: {path: data.path,
        block: {k: b.k, name: b.name, i: b.i}, values, src: form.src, page: page + 1}});
      if (!r || r.isError) throw new Error(((r && r.content || [])[0] || {}).text || "it was refused");
      if (host.caps.updateModelContext) request("ui/update-model-context", {content: [{type: "text", text:
        "CV Studio page view: the user edited \"" + name(b) + "\" in " + clean(data.path, 200) + ", at " + where(b) +
        ", themselves, and it is saved. Keep their wording, and read the file again before changing it."}]}).catch(() => {});
      const keep = page;
      onResult(r);
      page = Math.min(keep, data.shots.length - 1); paint();
      flash("Saved.");
    } catch (e) {
      editErr = clean(e.message, 400);
      paint();
    }
  }

  /* What changed, the way an editor marks it: the sentence once, the words
     that went struck through and the words that came in green. Lines that
     did not change are left out, a ⋯ where they were. */
  function lcs(a, b, eq) {
    const n = a.length, m = b.length, w = m + 1, t = new Uint16Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      t[i * w + j] = eq(a[i], b[j]) ? t[(i + 1) * w + j + 1] + 1 : Math.max(t[(i + 1) * w + j], t[i * w + j + 1]);
    const ops = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (eq(a[i], b[j])) { ops.push(["eq", i++, j++]); }
      else if (t[(i + 1) * w + j] >= t[i * w + j + 1]) ops.push(["del", i++, null]);
      else ops.push(["ins", null, j++]);
    }
    while (i < n) ops.push(["del", i++, null]);
    while (j < m) ops.push(["ins", null, j++]);
    return ops;
  }
  /* Words, the spaces between them, and punctuation on its own, so a
     colon added after a word does not strike the word. "99.99%", "can't"
     and "e-mail" stay whole. */
  const words = s => String(s).match(/\s+|[\p{L}\p{N}]+(?:['’.,\-][\p{L}\p{N}]+)*%?|[^\s]/gu) || [];
  /* One line against another, word by word. A run of change comes out as
     the words removed, then the words put in; a space between two changed
     words belongs to the run, so "2 million" replaced reads as one change. */
  function wordDiff(x, y) {
    const a = words(x), b = words(y);
    if (a.length * b.length > 90000) return "<del>" + esc(x) + "</del> <ins>" + esc(y) + "</ins>";
    const ops = lcs(a, b, (p, q) => p === q);
    let out = "", del = "", ins = "";
    const flush = () => {
      const d = del.trim(), n = ins.trim();
      if (d || n) {
        /* The space before the change stays plain text before it. */
        if (/^\s/.test(del) || /^\s/.test(ins)) out += " ";
        if (d) out += "<del>" + esc(d) + "</del>";
        if (d && n && !/^[^\p{L}\p{N}]/u.test(n)) out += " ";
        if (n) out += "<ins>" + esc(n) + "</ins>";
        if (/\s$/.test(n ? ins : del)) out += " ";
      }
      del = ""; ins = "";
    };
    ops.forEach(([op, i, j], k) => {
      if (op === "eq") {
        const next = ops[k + 1];
        if ((del || ins) && /^\s+$/.test(a[i]) && next && next[0] !== "eq") { del += a[i]; ins += a[i]; return; }
        flush(); out += esc(a[i]);
      } else if (op === "del") del += a[i];
      else ins += b[j];
    });
    flush();
    return out;
  }
  function diffHtml(before, after) {
    const b = String(before || "").split("\n").filter(Boolean), a = String(after || "").split("\n").filter(Boolean);
    const wrap = rows => '<div class="diff">' + rows.join("") + "</div>";
    if (!b.length) return wrap(['<p class="none">Not there before: Claude added it.</p>'].concat(
      a.map(l => '<p class="w"><ins>' + esc(l) + "</ins></p>")));
    if (!a.length) return wrap(b.map(l => '<p class="w"><del>' + esc(l) + "</del></p>"));
    const ops = lcs(b, a, (p, q) => p === q), rows = [];
    let k = 0, skipped = false;
    while (k < ops.length) {
      if (ops[k][0] === "eq") { skipped = true; k++; continue; }
      const dels = [], inss = [];
      while (k < ops.length && ops[k][0] !== "eq") { ops[k][0] === "del" ? dels.push(b[ops[k][1]]) : inss.push(a[ops[k][2]]); k++; }
      if (skipped && rows.length) rows.push('<p class="gap">⋯</p>');
      skipped = false;
      for (let x = 0; x < Math.max(dels.length, inss.length); x++) {
        if (x < dels.length && x < inss.length) rows.push('<p class="w">' + wordDiff(dels[x], inss[x]) + "</p>");
        else if (x < dels.length) rows.push('<p class="w"><del>' + esc(dels[x]) + "</del></p>");
        else rows.push('<p class="w"><ins>' + esc(inss[x]) + "</ins></p>");
      }
    }
    if (!rows.length) return wrap(['<p class="none">Only the order changed.</p>']);
    return wrap(rows);
  }
  /* The first change only, with a few words either side: a line in the
     review list. */
  function briefDiff(before, after) {
    const html = diffHtml(before, after);
    const m = html.match(/<p class="w">(.*?)<\/p>/);
    if (!m) return "";
    const line = m[1], at = line.search(/<(del|ins)>/);
    if (at < 0) return line;
    const lead = line.slice(0, at).replace(/&[a-z#0-9]+;/g, " ").split(/\s+/).filter(Boolean);
    return (lead.length > 5 ? "… " + esc(lead.slice(-5).join(" ")) + " " : line.slice(0, at)) + line.slice(at);
  }

  /* Keep or undo, here and now: no message, no model, the page drawn again
     as it is after. Claude is told, so it does not put an undone change back. */
  function wireActs(root) {
    root.querySelectorAll("[data-act]").forEach(btn => btn.onclick = () =>
      act(btn.dataset.ids === "*" ? ["*"] : [btn.dataset.ids], btn.dataset.act, btn));
  }

  async function act(ids, action, btn) {
