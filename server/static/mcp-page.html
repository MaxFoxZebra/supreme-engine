<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV page</title>
<!--
  The page view an AI client shows with render_cv (MCP Apps). It runs in the
  client's sandboxed frame with no network, so everything is in this file and
  the pages arrive as images in the tool result. It speaks to the client over
  postMessage (JSON-RPC 2.0): ui/initialize, then it is handed the tool's
  input and result. A click on a block selects it, tells the model what the
  user is pointing at (ui/update-model-context), and offers to send the
  change as the user's next message (ui/message).
-->
<style>
  :root{
    --bg:var(--color-background-primary,#fff);
    --bg2:var(--color-background-secondary,#f5f4f0);
    --tx:var(--color-text-primary,#1d1b16);
    --tx2:var(--color-text-secondary,#6b665c);
    --rule:var(--color-border-secondary,#e3dfd6);
    --acc:var(--color-ring-primary,#c08a3e);
    --font:var(--font-sans,system-ui,-apple-system,"Segoe UI",sans-serif);
    --radius:var(--border-radius-md,8px);
  }
  :root[data-theme=dark]{
    --bg:var(--color-background-primary,#1b1a17);
    --bg2:var(--color-background-secondary,#25231f);
    --tx:var(--color-text-primary,#f2efe8);
    --tx2:var(--color-text-secondary,#aaa497);
    --rule:var(--color-border-secondary,#3a3731);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:transparent;color:var(--tx);font:14px/1.45 var(--font)}
  .bar{display:flex;align-items:center;gap:8px;padding:6px 2px 8px;flex-wrap:wrap;
    margin:0 auto;max-width:560px}
  .bar .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%}
  .bar .meta{color:var(--tx2);font-size:12.5px}
  .bar .sp{flex:1}
  button{font:inherit;color:inherit}
  .btn{border:1px solid var(--rule);background:var(--bg);border-radius:var(--radius);
    padding:3px 10px;cursor:pointer;font-size:12.5px}
  .btn:hover{background:var(--bg2)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .sheet{position:relative;margin:0 auto;max-width:560px;background:#fff;
    border:1px solid var(--rule);border-radius:4px;overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .sheet img{display:block;width:100%;height:auto;user-select:none}
  .hit{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;
    border-radius:3px;outline-offset:-2px}
  .hit:hover,.hit:focus-visible{background:rgba(192,138,62,.10);
    box-shadow:inset 0 0 0 1.5px rgba(192,138,62,.55)}
  .hit.sel{background:rgba(192,138,62,.06);box-shadow:0 0 0 2px var(--acc)}
  .tip{position:absolute;left:8px;top:8px;background:rgba(29,27,22,.88);color:#fff;
    font-size:12px;padding:2px 8px;border-radius:99px;pointer-events:none;display:none}
  .ask{margin:10px auto 2px;max-width:560px;border:1px solid var(--rule);
    border-radius:var(--radius);background:var(--bg);padding:10px 12px}
  .ask[hidden]{display:none}
  .ask .what{font-weight:600;margin-bottom:6px}
  .ask .what span{color:var(--tx2);font-weight:400}
  .ask textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--rule);
    border-radius:6px;padding:7px 9px;font:inherit;color:var(--tx);background:var(--bg)}
  .ask .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .chip{border:1px solid var(--rule);background:var(--bg2);border-radius:99px;
    padding:2px 10px;cursor:pointer;font-size:12.5px}
  .note{color:var(--tx2);font-size:12.5px;margin:8px auto 0;max-width:560px}
  /* A whole page inline is a lot of chat; full screen is where it gets room. */
  :root[data-mode=fullscreen] .sheet,:root[data-mode=fullscreen] .ask,:root[data-mode=fullscreen] .bar,
  :root[data-mode=fullscreen] .note{max-width:880px}
  .empty{color:var(--tx2);padding:28px 8px;text-align:center}
  .err{white-space:pre-wrap;font:12px/1.4 var(--font-mono,ui-monospace,monospace);
    background:var(--bg2);border-radius:var(--radius);padding:10px;max-height:300px;overflow:auto}
</style>
</head>
<body>
<div id="app"><div class="empty">Rendering…</div></div>
<script>
(() => {
  "use strict";
  const PROTOCOL = "2026-01-26";
  let nextId = 1, host = {caps: {}, ctx: {}}, data = null, page = 0, sel = null;
  const pending = new Map();
  const $app = document.getElementById("app");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  /* JSON-RPC over postMessage, to the client that framed this page. */
  function send(msg) { window.parent.postMessage({jsonrpc: "2.0", ...msg}, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({id, method, params});
    return new Promise((resolve, reject) => pending.set(id, {resolve, reject}));
  }
  const notify = (method, params) => send({method, params});

  window.addEventListener("message", ev => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method && pending.has(m.id)) {
      const p = pending.get(m.id); pending.delete(m.id);
      m.error ? p.reject(new Error(m.error.message || "error")) : p.resolve(m.result);
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-input":
        if (!data) $app.innerHTML = '<div class="empty">Rendering ' +
          esc((m.params && m.params.arguments && m.params.arguments.path) || "") + "…</div>";
        break;
      case "ui/notifications/tool-result": onResult(m.params || {}); break;
      case "ui/notifications/tool-cancelled":
        if (!data) $app.innerHTML = '<div class="empty">The render was cancelled.</div>';
        break;
      case "ui/notifications/host-context-changed": applyContext(m.params || {}); break;
      case "ui/resource-teardown": send({id: m.id, result: {}}); break;
      case "ping": send({id: m.id, result: {}}); break;
      default:
        /* A request this view does not handle gets an answer, not silence. */
        if (m.id != null && m.method) send({id: m.id, error: {code: -32601, message: "Method not found"}});
    }
  });

  function applyContext(ctx) {
    host.ctx = {...host.ctx, ...ctx};
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
    if (ctx.styles && ctx.styles.css && ctx.styles.css.fonts) {
      const st = document.createElement("style"); st.textContent = ctx.styles.css.fonts;
      document.head.appendChild(st);
    }
    if (ctx.displayMode) document.documentElement.dataset.mode = ctx.displayMode;
    if (ctx.displayMode && data) paint();
  }

  function onResult(r) {
    const sc = r.structuredContent || r.structured_content;
    if (r.isError || !sc || !sc.images) {
      const text = (r.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
      $app.innerHTML = r.isError
        ? '<div class="err">' + esc(text || "The render failed.") + "</div>"
        : '<div class="empty">' + esc(text || "Nothing to show.") + "</div>";
      return;
    }
    data = sc; page = Math.max(0, Math.min((sc.page || 1) - 1, sc.images.length - 1)); sel = null;
    paint();
  }

  const can = cap => !!(host.caps && host.caps[cap]);
  const modes = () => host.ctx.availableDisplayModes || [];

  function bandsOn(p) { return (data.map || []).filter(b => b.page === p + 1); }
  const same = (a, b) => !!a && !!b && a.k === b.k && a.name === b.name && a.i === b.i;

  function paint() {
    const d = data, n = d.images.length, full = host.ctx.displayMode === "fullscreen";
    const name = String(d.path || "").split("/").pop();
    $app.innerHTML =
      '<div class="bar"><span class="name" title="' + esc(d.path) + '">' + esc(name) + "</span>" +
      '<span class="meta">' + (d.pages > 1 ? "Page " + (page + 1) + " of " + d.pages : "1 page") +
      (d.words ? " · " + d.words + " words" : "") + "</span><span class=\"sp\"></span>" +
      (n > 1 ? '<button class="btn" id="prev"' + (page ? "" : " disabled") + ">‹ Previous</button>" +
               '<button class="btn" id="next"' + (page < n - 1 ? "" : " disabled") + ">Next ›</button>" : "") +
      (modes().includes("fullscreen")
        ? '<button class="btn" id="mode">' + (full ? "Close full screen" : "Full screen") + "</button>" : "") +
      "</div>" +
      '<div class="sheet" id="sheet"><img id="pg" alt="Page ' + (page + 1) + ' of the CV" src="' +
      d.images[page] + '"><div class="tip" id="tip"></div></div>' +
      '<div class="ask" id="ask" hidden></div>' +
      (d.map && d.map.length
        ? '<p class="note">Click a block on the page to tell Claude what to change there.</p>'
        : d.letter ? "" : '<p class="note">This page could not be mapped, so blocks cannot be clicked.</p>') +
      (d.pages > n ? '<p class="note">Showing the first ' + n + " of " + d.pages + " pages.</p>" : "");
    const img = document.getElementById("pg");
    if (img.complete) hits(); else img.onload = hits;
    const prev = document.getElementById("prev"), next = document.getElementById("next");
    if (prev) prev.onclick = () => { page--; paint(); };
    if (next) next.onclick = () => { page++; paint(); };
    const mode = document.getElementById("mode");
    if (mode) mode.onclick = async () => {
      try {
        const r = await request("ui/request-display-mode", {mode: full ? "inline" : "fullscreen"});
        host.ctx.displayMode = r && r.mode;
        document.documentElement.dataset.mode = host.ctx.displayMode || "inline"; paint();
      } catch (e) { /* the client said no; nothing to undo */ }
    };
    if (sel) showAsk();
  }

  /* The click targets: one per block, the strip of page it owns, hugging the
     text column when the map knows where it is. Same geometry as the editor's
     page in the app. */
  function hits() {
    const sheet = document.getElementById("sheet"), img = document.getElementById("pg");
    if (!sheet || !img.naturalHeight) return;
    const box = data.box || null;
    const H = (box && box.page_height) || img.naturalHeight / 2;
    const W = (box && box.page_width) || img.naturalWidth / 2;
    const pad = 6;
    const left = box ? Math.max(0, (box.x0 - pad) / W * 100) : 0;
    const right = box ? Math.max(0, (W - box.x1 - pad) / W * 100) : 0;
    const pct = y => Math.max(0, Math.min(H, y)) / H * 100;
    const tip = document.getElementById("tip");
    bandsOn(page).forEach(b => {
      const top = pct(b.y0), bottom = b.y1 == null ? 100 : pct(b.y1);
      if (bottom - top <= 0) return;
      const el = document.createElement("button");
      el.className = "hit" + (same(b, sel) ? " sel" : "");
      el.style.cssText = "top:" + top + "%;height:" + (bottom - top) + "%;left:" + left + "%;right:" + right + "%";
      el.setAttribute("aria-label", "Change " + (b.label || "this block"));
      el.onmouseenter = () => { tip.textContent = b.label || ""; tip.style.display = b.label ? "block" : "none";
        tip.style.top = Math.max(4, el.offsetTop - 26) + "px"; tip.style.left = el.offsetLeft + "px"; };
      el.onmouseleave = () => { tip.style.display = "none"; };
      el.onclick = () => select(b);
      sheet.appendChild(el);
    });
  }

  /* Where in the YAML the block is, so the model edits the right thing. */
  function where(b) {
    if (b.k === "header") return "the header (cv.name, cv.headline, the contact details)";
    if (b.k === "section") return "the section cv.sections." + b.name;
    return "cv.sections." + b.name + "[" + b.i + "]";
  }

  function select(b) {
    sel = b;
    paint();
    /* So "make this shorter", typed in the chat itself, means this block. */
    if (host.caps.updateModelContext) {
      request("ui/update-model-context", {content: [{type: "text", text:
        "In the CV page view, the user selected " + (b.label || "a block") + " in " + data.path +
        " (" + where(b) + "). \"This\" in their next message means that block."}]}).catch(() => {});
    }
  }

  function showAsk() {
    const ask = document.getElementById("ask"), b = sel;
    const canSend = !!host.caps.message;
    ask.hidden = false;
    ask.innerHTML = '<div class="what">' + esc(b.label || "This block") + " <span>· " + esc(where(b)) + "</span></div>" +
      (canSend
        ? '<textarea id="msg" placeholder="What should change here?"></textarea>' +
          '<div class="row">' +
          ["Make it shorter", "Make it stronger", "Match the posting more closely", "Remove it"]
            .map(c => '<button class="chip" data-chip="' + esc(c) + '">' + esc(c) + "</button>").join("") +
          '<span style="flex:1"></span><button class="btn" id="clear">Cancel</button>' +
          '<button class="btn primary" id="go">Send to Claude</button></div>'
        : '<div class="note" style="margin:0">Now say in the chat what should change here: ' +
          "Claude knows which block you mean.</div>");
    const msg = document.getElementById("msg");
    const go = async text => {
      text = (text || "").trim();
      if (!text) { msg && msg.focus(); return; }
      const out = "In " + data.path + ", " + (b.label || "this block") + " (" + where(b) + "): " + text +
        "\nEdit it, then render the CV again so I can see it.";
      try {
        await request("ui/message", {role: "user", content: [{type: "text", text: out}]});
        sel = null; paint();
      } catch (e) {
        ask.insertAdjacentHTML("beforeend", '<div class="note">The message could not be sent: ' +
          esc(e.message) + ". Type it in the chat instead.</div>");
      }
    };
    if (msg) {
      msg.focus();
      msg.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) go(msg.value); };
      document.getElementById("go").onclick = () => go(msg.value);
      document.getElementById("clear").onclick = () => { sel = null; paint(); };
      ask.querySelectorAll("[data-chip]").forEach(c => c.onclick = () => go(c.dataset.chip));
    }
  }

  document.addEventListener("keydown", e => { if (e.key === "Escape" && sel) { sel = null; paint(); } });

  /* The client sizes the frame to what is in it. */
  new ResizeObserver(() => {
    const r = document.documentElement.getBoundingClientRect();
    notify("ui/notifications/size-changed", {width: Math.ceil(r.width), height: Math.ceil(r.height)});
  }).observe(document.documentElement);

  request("ui/initialize", {
    appInfo: {name: "CV Studio page", version: "1"},
    appCapabilities: {availableDisplayModes: ["inline", "fullscreen"]},
    protocolVersion: PROTOCOL,
  }).then(r => {
    host.caps = (r && r.hostCapabilities) || {};
    applyContext((r && r.hostContext) || {});
    notify("ui/notifications/initialized", {});
  }).catch(() => notify("ui/notifications/initialized", {}));
})();
</script>
</body>
</html>
